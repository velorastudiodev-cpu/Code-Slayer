lesson:
  - text: Hash map (dict di Python) menyimpan pasangan kunci-nilai dengan pencarian, sisip, dan hapus rata-rata O(1). set adalah hash map tanpa nilai. Mengganti "x in list" (O(n)) dengan "x in set" (O(1)) adalah optimasi paling sering di soal kompetisi.
    code: |
      umur = {"Tanjiro": 15}
      umur["Nezuko"] = 14
      print(umur.get("Giyu", "?"), "Nezuko" in umur)
      lihat = set()
      for x in [3, 1, 3]:
          print(x in lihat, end=" ")
          lihat.add(x)
exercises:
  - id: dsa-m3-twosum
    type: write
    title: Dua Jumlah
    difficulty: 2
    prompt: 'Baris 1 berisi target, baris 2 berisi bilangan (tidak terurut). Cari i < j dengan a[i] + a[j] = target, dengan j sekecil mungkin dan, untuk j itu, i sekecil mungkin. Cetak "i j" (0-based) atau -1. Harus O(n) dengan dict.'
    tests: ["9\n2 7 11 15", "6\n3 2 4", "6\n3 3", "10\n1 2 3"]
    hints: |
      Simpan indeks PERTAMA setiap nilai di dict.
      Untuk setiap j, cek apakah target - a[j] sudah ada di dict.
      Masukkan a[j] ke dict SETELAH dicek, dan hanya kalau belum ada.
    solution: |
      t = int(input())
      a = list(map(int, input().split()))
      pertama = {}
      jawab = "-1"
      for j, x in enumerate(a):
          if t - x in pertama:
              jawab = f"{pertama[t - x]} {j}"
              break
          pertama.setdefault(x, j)
      print(jawab)
  - id: dsa-m3-anagram
    type: write
    title: Kelompok Anagram
    difficulty: 2
    prompt: Baca satu baris kata. Kelompokkan kata yang merupakan anagram (huruf sama, urutan beda). Cetak setiap kelompok dalam satu baris (kata diurutkan), dan baris-barisnya diurutkan.
    tests: ["api pia air ria ira batu", "a b a"]
    hints: |
      Kunci dict adalah "".join(sorted(kata)).
      Kumpulkan kata per kunci.
      Urutkan isi tiap kelompok, lalu urutkan baris-barisnya.
    solution: |
      grup = {}
      for k in input().split():
          grup.setdefault("".join(sorted(k)), []).append(k)
      for baris in sorted(" ".join(sorted(g)) for g in grup.values()):
          print(baris)
  - id: dsa-m3-refactor-set
    type: refactor
    title: Percepat dengan Set
    difficulty: 2
    prompt: Kode ini benar tapi O(n²) karena mencari di list. Refactor supaya memakai set, dengan output yang tetap sama.
    starter: |
      kata = input().split()
      dilihat = []
      dobel = []
      for k in kata:
          if k in dilihat and k not in dobel:
              dobel.append(k)
          dilihat.append(k)
      print(len(dobel))
    rules:
      - text: dilihat dibuat sebagai set
        require: 'dilihat\s*=\s*set\(\)'
      - text: dobel dibuat sebagai set
        require: 'dobel\s*=\s*set\(\)'
    tests: ["a b a c b a", "x y z", "k k k k"]
    hints: |
      set() membuat set kosong.
      set memakai .add(), bukan .append().
      len() tetap bekerja untuk set.
    solution: |
      kata = input().split()
      dilihat = set()
      dobel = set()
      for k in kata:
          if k in dilihat:
              dobel.add(k)
          dilihat.add(k)
      print(len(dobel))
  - id: dsa-m3-refactor-counter
    type: refactor
    title: Hitung Tanpa if
    difficulty: 1
    prompt: Penghitung huruf ini benar tapi bertele-tele. Refactor memakai collections.Counter (atau dict.get) dengan output tetap sama.
    starter: |
      hitung = {}
      for h in input():
          if h in hitung:
              hitung[h] = hitung[h] + 1
          else:
              hitung[h] = 1
      for h in sorted(hitung):
          print(h, hitung[h])
    rules:
      - text: Maksimal 4 baris kode
        max_lines: 4
      - text: Tanpa if/else manual untuk menghitung
        forbid: '\bif\b'
    tests: ["banana", "kamado", "z"]
    hints: |
      from collections import Counter
      Counter(teks) langsung menghitung semua huruf.
      Loop pencetakan tetap sama.
    solution: |
      from collections import Counter
      hitung = Counter(input())
      for h in sorted(hitung):
          print(h, hitung[h])
  - id: dsa-m3-complexity
    type: complexity
    title: Kompleksitas Two Sum Dict
    difficulty: 2
    prompt: Berapa kompleksitas waktu rata-rata fungsi ini terhadap n = len(a)?
    code: |
      def dua_jumlah(a, t):
          lihat = {}
          for j, x in enumerate(a):
              if t - x in lihat:
                  return lihat[t - x], j
              lihat[x] = j
          return None
    answer: O(n)
    explain: Satu loop atas n elemen, dan setiap operasi dict rata-rata O(1).
    hints: |
      Ada berapa loop?
      Pencarian kunci dict rata-rata O(1).
      n × O(1).
