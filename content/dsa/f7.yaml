lesson:
  - text: Two pointers memakai dua indeks yang bergerak di array, biasanya dari kedua ujung saling mendekat atau keduanya maju dengan kecepatan berbeda. Pada array terurut, mencari pasangan berjumlah target cukup O(n), bukan O(n²).
    code: |
      a = [1, 2, 4, 6, 8, 9]
      l, r = 0, len(a) - 1
      while l < r:
          s = a[l] + a[r]
          if s == 10: print("ketemu", a[l], a[r]); break
          if s < 10: l += 1
          else: r -= 1
exercises:
  - id: dsa-f7-pasangan
    type: write
    title: Pasangan Bilah Seimbang
    difficulty: 2
    prompt: Baris 1 berisi target, baris 2 berisi bilangan terurut naik. Cetak "ya" jika ada dua elemen (posisi berbeda) yang jumlahnya target, selain itu "tidak". Gunakan two pointers.
    tests: ["10\n1 2 4 6 8 9", "100\n1 2 3", "4\n2 2", "4\n2"]
    hints: |
      l di awal, r di akhir.
      Jumlah terlalu kecil berarti geser l, terlalu besar berarti geser r.
      Berhenti saat l >= r.
    solution: |
      t = int(input())
      a = list(map(int, input().split()))
      l, r = 0, len(a) - 1
      ada = False
      while l < r:
          s = a[l] + a[r]
          if s == t:
              ada = True
              break
          if s < t:
              l += 1
          else:
              r -= 1
      print("ya" if ada else "tidak")
  - id: dsa-f7-palindrom
    type: write
    title: Cermin Bersih
    difficulty: 2
    prompt: 'Baca satu baris teks. Cetak "ya" jika palindrom setelah mengabaikan selain huruf dan tanpa membedakan besar/kecil. Contoh: "Kasur ini rusak!" adalah palindrom.'
    tests: ["Kasur ini rusak!", "Tanjiro", "A", "!!"]
    hints: |
      l dari kiri, r dari kanan, dan lewati karakter yang bukan huruf.
      Bandingkan dengan lower().
      Teks tanpa huruf dianggap palindrom.
    solution: |
      s = input()
      l, r = 0, len(s) - 1
      ok = True
      while l < r:
          if not s[l].isalpha():
              l += 1
          elif not s[r].isalpha():
              r -= 1
          elif s[l].lower() != s[r].lower():
              ok = False
              break
          else:
              l += 1
              r -= 1
      print("ya" if ok else "tidak")
  - id: dsa-f7-fill-balik
    type: fill
    title: Membalik di Tempat
    difficulty: 1
    prompt: Lengkapi program yang membalik list tanpa list baru (in-place) dengan dua pointer.
    code: |
      a = input().split()
      l, r = 0, len(a) - 1
      while ⟦l < r⟧:
          a[l], a[r] = a[r], a[l]
          ⟦l += 1⟧
          r -= 1
      print(*a)
    tests: ["1 2 3 4 5", "a b", "x"]
    hints: |
      Berhenti saat kedua pointer bertemu.
      Setelah menukar, kedua pointer saling mendekat.
      l maju, r mundur.
  - id: dsa-f7-trace
    type: trace
    title: Jejak Dua Pointer
    difficulty: 2
    prompt: Mencari dua angka berjumlah 12. Isi nilai l, r, dan s setiap kali baris 4 selesai dijalankan.
    code: |
      a = [1, 2, 4, 6, 8, 9]
      l, r = 0, 5
      while l < r:
          s = a[l] + a[r]
          if s == 12:
              break
          if s < 12:
              l += 1
          else:
              r -= 1
    line: 4
    vars: [l, r, s]
    hints: |
      Awalnya 1 + 9 = 10 < 12, jadi l maju.
      Saat jumlahnya lebih dari 12, r mundur.
      Berhenti saat s == 12.
  - id: dsa-f7-unik
    type: write
    title: Menghitung yang Berbeda
    difficulty: 1
    prompt: Baca bilangan terurut naik (boleh ada yang sama). Cetak banyaknya nilai berbeda, tanpa set, memakai pointer yang membandingkan dengan elemen sebelumnya.
    tests: ["1 1 2 3 3 3 7", "5", "2 2 2"]
    hints: |
      Elemen pertama selalu baru.
      a[i] baru kalau berbeda dari a[i-1].
      Hitung yang baru.
    solution: |
      a = input().split()
      print(1 + sum(1 for i in range(1, len(a)) if a[i] != a[i - 1]))
