lesson:
  - text: Sliding window memproses subarray yang bergeser. Saat jendela bergeser satu langkah, cukup tambahkan elemen yang masuk dan kurangi elemen yang keluar, tidak perlu menghitung ulang semuanya. O(n·k) menjadi O(n).
    code: |
      a, k = [2, 1, 5, 1, 3, 2], 3
      s = sum(a[:k])
      best = s
      for i in range(k, len(a)):
          s += a[i] - a[i - k]
          best = max(best, s)
      print(best)
exercises:
  - id: dsa-m4-maxsum
    type: write
    title: Jendela Terkuat
    difficulty: 2
    prompt: Baris 1 berisi n dan k, baris 2 berisi n bilangan. Cetak jumlah maksimum dari k elemen berurutan.
    tests: ["6 3\n2 1 5 1 3 2", "5 1\n-1 -2 -3 -4 -5", "3 3\n1 2 3"]
    hints: |
      Hitung jumlah jendela pertama.
      Geser dengan + yang masuk dan − yang keluar.
      Simpan maksimumnya.
    solution: |
      n, k = map(int, input().split())
      a = list(map(int, input().split()))
      s = sum(a[:k])
      best = s
      for i in range(k, n):
          s += a[i] - a[i - k]
          best = max(best, s)
      print(best)
  - id: dsa-m4-unik
    type: write
    title: Rangkaian Tanpa Kembar
    difficulty: 3
    prompt: Baca satu kata. Cetak panjang substring terpanjang yang tidak punya huruf berulang.
    tests: ["abcabcbb", "bbbbb", "pwwkew", "a", "dvdf"]
    hints: |
      Jendela [kiri, i] selalu tanpa huruf kembar.
      Simpan posisi terakhir setiap huruf di dict.
      Kalau huruf sudah ada di dalam jendela, geser kiri ke posisi_terakhir + 1.
    solution: |
      s = input()
      terakhir = {}
      kiri = best = 0
      for i, c in enumerate(s):
          if terakhir.get(c, -1) >= kiri:
              kiri = terakhir[c] + 1
          terakhir[c] = i
          best = max(best, i - kiri + 1)
      print(best)
  - id: dsa-m4-fill
    type: fill
    title: Rata-rata Bergerak
    difficulty: 2
    prompt: Lengkapi program yang mencetak rata-rata setiap jendela k elemen (1 desimal) dengan sliding window.
    code: |
      n, k = map(int, input().split())
      a = list(map(int, input().split()))
      s = sum(a[:k])
      hasil = [s / k]
      for i in range(k, n):
          s += ⟦a[i] - a[i - k]⟧
          hasil.append(⟦s / k⟧)
      print(" ".join(f"{x:.1f}" for x in hasil))
    tests: ["5 2\n1 3 5 7 9", "3 3\n3 3 3", "4 1\n4 2 0 8"]
    hints: |
      Elemen masuk adalah a[i], elemen keluar adalah a[i - k].
      Rata-rata = jumlah / k.
      s += a[i] - a[i - k]
  - id: dsa-m4-refactor
    type: refactor
    title: Hapus Loop Bersarang
    difficulty: 2
    prompt: Kode ini benar tapi O(n·k). Refactor menjadi sliding window O(n).
    starter: |
      n, k = map(int, input().split())
      a = list(map(int, input().split()))
      best = None
      for i in range(n - k + 1):
          s = 0
          for j in range(i, i + k):
              s += a[j]
          if best is None or s > best:
              best = s
      print(best)
    rules:
      - text: Tidak ada for di dalam for
        forbid: '^\s+for\s'
      - text: Tidak menjumlah ulang setiap jendela dengan sum()
        forbid: 'sum\(a\[i'
    tests: ["6 3\n2 1 5 1 3 2", "5 1\n-1 -2 -3 -4 -5", "3 3\n1 2 3"]
    hints: |
      Hitung jendela pertama sekali, di luar loop utama.
      Lalu geser dengan s += a[i] - a[i - k].
      Satu loop for saja di level atas.
    solution: |
      n, k = map(int, input().split())
      a = list(map(int, input().split()))
      s = sum(a[:k])
      best = s
      for i in range(k, n):
          s += a[i] - a[i - k]
          best = max(best, s)
      print(best)
