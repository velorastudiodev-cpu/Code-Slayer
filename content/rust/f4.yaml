lesson:
- text: 'Cara praktis membaca input: baca seluruh stdin ke String, lalu pecah dengan split_whitespace(). Setiap token diubah dengan parse(). unwrap() mengambil nilai sukses, atau panik kalau gagal.'
  code: |
    use std::io::{self, Read};

    fn main() {
        let mut input = String::new();
        io::stdin().read_to_string(&mut input).unwrap();
        let angka: Vec<i64> = input.split_whitespace().map(|x| x.parse().unwrap()).collect();
        println!("{} angka, jumlah {}", angka.len(), angka.iter().sum::<i64>());
    }
- text: read_line membaca satu baris TERMASUK newline-nya. Bersihkan dengan trim() sebelum parse(). Kalau tidak, "21\n".parse() gagal.
  code: |
    use std::io;

    fn main() {
        let mut baris = String::new();
        io::stdin().read_line(&mut baris).unwrap();
        println!("[{}]", baris.trim());
    }
exercises:
- id: rs-f4-jumlah
  type: write
  title: Menjumlah Dua Bilah
  difficulty: 1
  prompt: Baca dua bilangan bulat (dalam satu baris), cetak jumlahnya.
  starter: |
    use std::io::{self, Read};

    fn main() {
        let mut input = String::new();
        io::stdin().read_to_string(&mut input).unwrap();
        // tulis kodemu di sini
    }
  tests:
  - 3 4
  - 10 -2
  - 0 0
  hints: |
    Baca dua bilangan dari input.
    Ubah teks menjadi angka.
    Cetak a + b.
  solution: |
    use std::io::{self, Read};

    fn main() {
        let mut input = String::new();
        io::stdin().read_to_string(&mut input).unwrap();
        let mut it = input.split_whitespace();
        let a: i64 = it.next().unwrap().parse().unwrap();
        let b: i64 = it.next().unwrap().parse().unwrap();
        println!("{}", a + b);
    }
- id: rs-f4-n
  type: write
  title: Laporan Berjumlah n
  difficulty: 2
  prompt: Baris pertama berisi n, baris kedua berisi n bilangan. Cetak jumlah dan nilai terbesarnya, dipisah spasi.
  starter: |
    use std::io::{self, Read};

    fn main() {
        let mut input = String::new();
        io::stdin().read_to_string(&mut input).unwrap();
        // tulis kodemu di sini
    }
  tests:
  - |-
    3
    1 9 2
  - |-
    1
    -5
  - |-
    5
    -1 -2 -3 -4 -5
  hints: |
    Nilai terbesar awal = bilangan pertama, bukan 0.
    Ingat bilangan bisa negatif semua.
    Cetak "<jumlah> <maks>".
  solution: |
    use std::io::{self, Read};

    fn main() {
        let mut input = String::new();
        io::stdin().read_to_string(&mut input).unwrap();
        let mut it = input.split_whitespace();
        let n: usize = it.next().unwrap().parse().unwrap();
        let xs: Vec<i64> = (0..n).map(|_| it.next().unwrap().parse().unwrap()).collect();
        let total: i64 = xs.iter().sum();
        let maks = xs.iter().max().unwrap();
        println!("{} {}", total, maks);
    }
- id: rs-f4-eof
  type: write
  title: Sampai Gulungan Habis
  difficulty: 2
  prompt: Input berisi sejumlah bilangan bulat dipisah spasi atau baris baru (banyaknya tidak diketahui). Cetak banyaknya bilangan dan rata-ratanya (2 desimal), dipisah spasi.
  starter: |
    use std::io::{self, Read};

    fn main() {
        let mut input = String::new();
        io::stdin().read_to_string(&mut input).unwrap();
        // tulis kodemu di sini
    }
  tests:
  - 1 2 3 4
  - '10'
  - |-
    5
    6
    7
  hints: |
    Baca seluruh input lalu pecah berdasarkan spasi/baris.
    Hitung banyak dan jumlahnya.
    Rata-rata = jumlah / banyak, dalam desimal.
  solution: |
    use std::io::{self, Read};

    fn main() {
        let mut input = String::new();
        io::stdin().read_to_string(&mut input).unwrap();
        let xs: Vec<i64> = input.split_whitespace().map(|x| x.parse().unwrap()).collect();
        let total: i64 = xs.iter().sum();
        println!("{} {:.2}", xs.len(), total as f64 / xs.len() as f64);
    }
- id: rs-f4-bug
  type: bughunt
  title: Spasi yang Menyusup
  difficulty: 2
  prompt: Program membaca satu baris berisi angka lalu mencetak angka itu dikali 2, tapi gagal karena baris input masih membawa karakter newline. Temukan baris yang salah.
  starter: |
    use std::io;

    fn main() {
        let mut baris = String::new();
        io::stdin().read_line(&mut baris).unwrap();
        let n: i64 = baris.parse().expect("bukan angka");
        println!("{}", n * 2);
    }
  bug_line: 6
  tests:
  - |
    21
  - |
    0
  - |
    -7
  hints: |
    Baris yang dibaca masih berisi "\n" di ujungnya.
    Teks "21\n" tidak bisa diubah langsung menjadi angka.
    Buang spasi/newline di ujung sebelum mengubah ke angka.
  solution: |
    use std::io;

    fn main() {
        let mut baris = String::new();
        io::stdin().read_line(&mut baris).unwrap();
        let n: i64 = baris.trim().parse().expect("bukan angka");
        println!("{}", n * 2);
    }
