lesson:
- text: 'String di Kotlin immutable. Fungsi berguna: toUpperCase(), length, substring(a, b), split(" "), reversed(), joinToString(). Karakter diakses dengan s[i].'
  code: |
    fun main() {
        val s = "Kimetsu no Yaiba"
        println("${s.toUpperCase()} ${s.length} ${s.substring(0, 7)}")
        val kata = s.split(" ")
        println("${kata.size} ${kata.joinToString("-")}")
    }
- text: 'Char bisa dihitung: ''a'' + 2 == ''c'', ''z'' - ''a'' == 25 (Int). map pada String (s.map { }) menghasilkan List, jadi gabungkan lagi dengan joinToString("").'
  code: |
    fun main() {
        val besar = "abc".map { it.toUpperCase() }.joinToString("")
        println("$besar ${"abc".reversed()} ${'a' + 2} ${'z' - 'a'}")
    }
exercises:
- id: kt-m2-palindrom
  type: write
  title: Kata Cermin
  difficulty: 1
  prompt: Baca satu kata. Cetak "palindrom" jika sama dibaca dari depan dan belakang (abaikan huruf besar/kecil), selain itu "bukan".
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - Katak
  - slayer
  - a
  - Malam
  hints: |
    Ubah ke huruf kecil dulu.
    Bandingkan dengan versi terbaliknya.
    Atau bandingkan karakter i dengan n-1-i.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val s = t[0].toLowerCase()
        println(if (s == s.reversed()) "palindrom" else "bukan")
    }
- id: kt-m2-vokal
  type: write
  title: Hitung Napas Vokal
  difficulty: 1
  prompt: Baca satu baris teks. Cetak banyaknya huruf vokal (a, i, u, e, o, besar maupun kecil).
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - Kimetsu no Yaiba
  - xyz
  - AIUEO aiueo
  hints: |
    Telusuri setiap karakter.
    Ubah ke huruf kecil supaya cukup satu pengecekan.
    Cek apakah karakter ada di "aiueo".
  solution: |
    fun main() {
        val s = System.`in`.bufferedReader().readText().toLowerCase()
        println(s.count { it in "aiueo" })
    }
- id: kt-m2-kapital
  type: write
  title: Nama Bergelar
  difficulty: 2
  prompt: Baca satu baris berisi kata-kata huruf kecil dipisah satu spasi. Cetak dengan huruf pertama setiap kata dijadikan kapital.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - kamado tanjiro
  - rengoku kyojuro sang hashira api
  - x
  hints: |
    Pecah baris menjadi kata.
    Kapitalkan karakter pertama tiap kata.
    Gabungkan kembali dengan spasi.
  solution: |
    fun main() {
        val kata = readLine()!!.trim().split(" ")
        println(kata.joinToString(" ") { it.substring(0, 1).toUpperCase() + it.substring(1) })
    }
- id: kt-m2-caesar
  type: write
  title: Sandi Gagak
  difficulty: 2
  prompt: Baris pertama k (0-25), baris kedua pesan huruf kecil dan spasi. Geser setiap huruf k posisi ke depan (z kembali ke a), spasi tetap. Cetak hasilnya.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - |-
    3
    slayer
  - |-
    1
    zaz
  - |-
    13
    kaa kaa
  hints: |
    Huruf ke-i dari a = c - 'a'.
    Geser: (i + k) % 26.
    Spasi dicetak apa adanya.
  solution: |
    fun main() {
        val k = readLine()!!.trim().toInt()
        val pesan = readLine() ?: ""
        println(pesan.map { if (it in 'a'..'z') 'a' + (it - 'a' + k) % 26 else it }.joinToString(""))
    }
- id: kt-m2-predict
  type: predict
  title: Potongan Teks
  difficulty: 2
  prompt: Tulis output persis dari program berikut.
  code: |
    fun main() {
        val s = "Hashira"
        println("${s.length} ${s.substring(0, 4)} ${s.substring(4)}")
        println("${s.indexOf('i')} ${s.count { it == 'a' }}")
        println(s.replaceFirst("a", "A"))
    }
  hints: |
    Indeks string mulai dari 0.
    Potongan [a, b) mengambil a sampai b-1.
    Panjang dihitung per karakter ASCII di sini.
  solution: x
- id: kt-m2-bug
  type: bughunt
  title: Perbandingan yang Menipu
  difficulty: 2
  prompt: Program harus mencetak "sama" jika dua kata yang dibaca sama persis tanpa memedulikan huruf besar/kecil, selain itu "beda". Tapi "Tanjiro" dan "tanjiro" dianggap beda. Temukan baris yang salah.
  starter: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val a = t[0]
        val b = t[1]
        println(if (a == b) "sama" else "beda")
    }
  bug_line: 5
  tests:
  - Tanjiro tanjiro
  - Nezuko nezuko
  - Giyu Sabito
  hints: |
    Huruf besar dan kecil adalah karakter berbeda.
    Samakan dulu bentuknya sebelum dibandingkan.
    Ubah keduanya ke huruf kecil.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val a = t[0]
        val b = t[1]
        println(if (a.equals(b, ignoreCase = true)) "sama" else "beda")
    }
