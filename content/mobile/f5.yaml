lesson:
- text: if / else if / else seperti bahasa C, dan karena if adalah ekspresi, hasilnya bisa langsung disimpan ke variabel.
  code: |
    fun main() {
        val nilai = 78
        val huruf = if (nilai >= 85) "A" else if (nilai >= 70) "B" else "C"
        println(huruf)
    }
- text: 'when adalah switch yang lebih kuat: mencocokkan nilai, beberapa nilai (1, 2 ->), rentang (in 1..9), atau kondisi bebas kalau ditulis tanpa argumen. Tidak perlu break.'
  code: |
    fun main() {
        for (x in listOf(0, 7, 42)) {
            val s = when (x) {
                0 -> "nol"
                in 1..9 -> "satu digit"
                else -> if (x % 2 == 0) "genap besar" else "lainnya"
            }
            println("$x $s")
        }
    }
exercises:
- id: kt-f5-nilai
  type: write
  title: Rapor Kisatsutai
  difficulty: 1
  prompt: Baca nilai (0-100). Cetak A jika ≥ 85, B jika ≥ 70, C jika ≥ 55, selain itu D.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - '90'
  - '85'
  - '70'
  - '69'
  - '55'
  - '10'
  hints: |
    Periksa dari syarat tertinggi.
    Rantai if / else if / else.
    Cetak satu huruf saja.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        println(when {
            n >= 85 -> "A"
            n >= 70 -> "B"
            n >= 55 -> "C"
            else -> "D"
        })
    }
- id: kt-f5-kabisat
  type: write
  title: Tahun Kabisat
  difficulty: 2
  prompt: Baca tahun. Cetak "kabisat" jika habis dibagi 400, atau habis dibagi 4 tapi tidak habis dibagi 100. Selain itu "bukan".
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - '2024'
  - '1900'
  - '2000'
  - '2023'
  hints: |
    Habis dibagi berarti % ... == 0.
    Gabungkan dengan || dan &&.
    (t % 400 == 0) || (t % 4 == 0 && t % 100 != 0)
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val y = t[0].toInt()
        println(if (y % 400 == 0 || (y % 4 == 0 && y % 100 != 0)) "kabisat" else "bukan")
    }
- id: kt-f5-predict
  type: predict
  title: Cabang Mana yang Dipilih?
  difficulty: 2
  prompt: Tulis output persis dari program berikut.
  code: |
    fun main() {
        for (x in listOf(0, 3, 8, 15)) {
            val s = when {
                x == 0 -> "nol"
                x % 2 == 1 && x > 10 -> "besar-ganjil"
                x % 2 == 1 -> "ganjil"
                else -> "genap"
            }
            print("$s ")
        }
        println()
    }
  hints: |
    Telusuri nilai variabel baris demi baris.
    Hanya satu cabang yang dijalankan per pemeriksaan.
    Perhatikan kasus default/else.
  solution: x
- id: kt-f5-parsons
  type: parsons
  title: Tanda Bilangan
  difficulty: 1
  prompt: Susun program yang mencetak "positif", "negatif", atau "nol".
  tests:
  - '5'
  - '-3'
  - '0'
  hints: |
    Deklarasi fungsi utama paling atas.
    Baca n sebelum memeriksanya.
    Kurung tutup paling akhir.
  solution: |
    fun main() {
        val n = readLine()!!.trim().toInt()
        when {
            n > 0 -> println("positif")
            n < 0 -> println("negatif")
            else -> println("nol")
        }
    }
