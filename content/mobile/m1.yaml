lesson:
- text: 'listOf membuat List yang tidak bisa diubah; mutableListOf bisa ditambah (add). List adalah referensi: dua variabel bisa menunjuk list yang sama. toMutableList() membuat salinan.'
  code: |
    fun main() {
        val a = mutableListOf(3, 1, 2)
        val b = a
        b.add(9)
        val c = a.toMutableList()
        c[0] = 100
        println("$a ${c.sorted()} ${a.size}")
    }
- text: mapOf / mutableMapOf memetakan kunci ke nilai; toSortedMap() mengurutkan kunci. groupingBy { it }.eachCount() langsung menghitung kemunculan setiap elemen.
  code: |
    fun main() {
        val hitung = listOf("b", "a", "b").groupingBy { it }.eachCount().toSortedMap()
        for ((k, v) in hitung) println("$k $v")
    }
exercises:
- id: kt-m1-balik
  type: write
  title: Barisan Terbalik
  difficulty: 1
  prompt: Baris pertama n, baris kedua n bilangan. Cetak bilangan-bilangan itu dalam urutan terbalik, dipisah spasi.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - |-
    5
    1 2 3 4 5
  - |-
    1
    42
  - |-
    3
    -1 0 -1
  hints: |
    Simpan semua bilangan ke array/list.
    Telusuri dari indeks terakhir ke 0.
    Gabungkan dengan spasi.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        println(t.drop(1).take(n).reversed().joinToString(" "))
    }
- id: kt-m1-frekuensi
  type: write
  title: Sensus Kata
  difficulty: 2
  prompt: Input berisi beberapa kata (dipisah spasi/baris). Cetak setiap kata unik beserta jumlahnya, "kata jumlah" per baris, urut abjad.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - iblis slayer iblis bulan
  - a
  - |-
    b a b
    a c b
  hints: |
    Pakai map/dictionary: kata → jumlah.
    Ambil semua kunci lalu urutkan.
    Cetak "kata jumlah".
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        for ((k, v) in t.groupingBy { it }.eachCount().toSortedMap()) println("$k $v")
    }
- id: kt-m1-unik
  type: write
  title: Pasukan Tanpa Kembar
  difficulty: 2
  prompt: Baris pertama n, baris kedua n bilangan. Cetak bilangan unik dalam urutan menaik, dipisah spasi.
  starter: |
    fun main() {
