    }
  tests:
  - |-
    6
    3 1 3 2 1 3
  - |-
    1
    7
  - |-
    4
    -2 5 -2 0
  hints: |
    Set/himpunan otomatis membuang duplikat.
    Urutkan hasilnya.
    Gabungkan dengan spasi.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
