- id: kt-m1-diatas
  type: write
  title: Di Atas Rata-rata
  difficulty: 2
  prompt: Baris pertama n, baris kedua n nilai. Cetak banyaknya nilai yang lebih besar dari rata-rata.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - |-
    5
    10 20 30 40 50
  - |-
    3
    5 5 5
  - |-
    4
    1 1 1 9
  hints: |
    Hitung rata-rata dulu (desimal).
    Lalu hitung nilai > rata-rata.
    Butuh dua kali menelusuri data.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        val xs = t.drop(1).take(n).map { it.toDouble() }
        val rata = xs.average()
        println(xs.count { it > rata })
    }
- id: kt-m1-predict
  type: predict
  title: Koleksi Berbagi
  difficulty: 2
  prompt: Tulis output persis dari program berikut.
  code: |
    fun main() {
        val a = mutableListOf(1, 2, 3)
        val b = a
        b[0] = 9
        val c = a.toMutableList()
        c[1] = 7
        println("$a $c")
        val m = mutableMapOf("x" to 1)
        m["x"] = m.getValue("x") + 4
        println("${m["x"]} ${m.size} ${m["y"]}")
    }
  hints: |
    Perhatikan apakah koleksi disalin atau dibagi (referensi).
    Mengubah lewat referensi terlihat dari nama lain.
    Telusuri isi koleksi setelah tiap perubahan.
  solution: x
- id: kt-m1-bug
  type: bughunt
  title: Indeks Melewati Batas
  difficulty: 2
  prompt: Program menjumlah semua elemen array, tapi crash karena indeks di luar batas. Temukan baris yang salah.
  starter: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        val xs = t.drop(1).take(n).map { it.toLong() }
        var total = 0L
        for (i in 0..xs.size) total += xs[i]
        println(total)
    }
  bug_line: 6
  tests:
  - |-
    3
    1 2 3
  - |-
    1
    5
  - |-
    4
    2 2 2 2
  hints: |
    Indeks terakhir = panjang - 1.
    Kondisi loop memakai <=.
    Gunakan < panjang.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        val xs = t.drop(1).take(n).map { it.toLong() }
        var total = 0L
        for (i in 0 until xs.size) total += xs[i]
        println(total)
    }
