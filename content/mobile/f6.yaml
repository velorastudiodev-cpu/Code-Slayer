lesson:
- text: for (i in 1..n) menelusuri 1 sampai n; 0 until n berhenti sebelum n; 10 downTo 1 mundur; step mengatur lompatan. while dan do-while juga tersedia.
  code: |
    fun main() {
        for (i in 1..3) print("$i ")
        for (i in 10 downTo 1 step 4) print("$i ")
        var n = 10
        while (n > 1) n /= 2
        println("| $n")
    }
- text: '"*".repeat(n) membuat teks berulang. Koleksi punya fungsi seperti sum(), filter { }, map { } yang sering menggantikan loop manual.'
  code: |
    fun main() {
        println("*".repeat(4))
        println((1..10).filter { it % 2 == 0 }.sum())
    }
exercises:
- id: kt-f6-segitiga
  type: write
  title: Formasi Segitiga
  difficulty: 1
  prompt: Baca n, cetak segitiga bintang n baris. Baris ke-i berisi i tanda *.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - '3'
  - '1'
  - '5'
  hints: |
    Loop i dari 1 sampai n.
    Baris ke-i = "*" diulang i kali.
    Setiap baris diakhiri newline.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        for (i in 1..n) println("*".repeat(i))
    }
- id: kt-f6-prima
  type: write
  title: Uji Bilangan Prima
  difficulty: 2
  prompt: Baca n (n ≤ 10^9). Cetak "prima" atau "bukan". Cukup periksa pembagi sampai akar n.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - '7'
  - '1'
  - '91'
  - '2'
  - '999999937'
  - '1000000000'
  hints: |
    1 bukan prima.
    Loop d mulai 2 selama d * d <= n.
    Pakai tipe 64-bit supaya d * d tidak overflow.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toLong()
        var prima = n > 1
        var d = 2L
        while (d * d <= n) {
            if (n % d == 0L) {
                prima = false
                break
            }
            d++
        }
        println(if (prima) "prima" else "bukan")
    }
- id: kt-f6-predict
  type: predict
  title: Loop Berlapis
  difficulty: 2
  prompt: Tulis output persis dari program berikut.
  code: |
    fun main() {
        for (i in 0 until 5) {
            if (i == 1) continue
            if (i == 4) break
            print("$i ")
        }
        var total = 0
        for (a in 1..2) for (b in 1..3) total += a * b
        println("| $total")
    }
  hints: |
    continue melompati sisa satu putaran.
    break menghentikan loop sepenuhnya.
    Telusuri nilai i satu per satu.
  solution: x
- id: kt-f6-bug
  type: bughunt
  title: Satu Tebasan Hilang
  difficulty: 1
  prompt: Program harus mencetak jumlah 1 + 2 + ... + n, tapi hasilnya selalu kurang. Temukan baris yang salah.
  starter: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toLong()
        var total = 0L
        for (i in 1 until n) total += i
        println(total)
    }
  bug_line: 5
  tests:
  - '3'
  - '10'
  - '1'
  hints: |
    Apakah n sendiri ikut dijumlah?
    Batas loop berhenti sebelum n.
    Ganti batasnya supaya n ikut.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toLong()
        var total = 0L
        for (i in 1..n) total += i
        println(total)
    }
