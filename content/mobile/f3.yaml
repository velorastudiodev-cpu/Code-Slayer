lesson:
- text: 'Operator aritmetika: + - * / %, juga += ++ --. Di Kotlin, operator juga bisa ditulis sebagai fungsi: a.rem(b) sama dengan a % b.'
  code: |
    fun main() {
        val t = 3725
        println("${t / 3600} ${t % 3600 / 60} ${t % 60}")
        var n = 5
        n += 3
        n++
        println(n)
    }
- text: 'Perbandingan menghasilkan Boolean; logika && || !. if di Kotlin adalah ekspresi: val s = if (x > 0) "positif" else "bukan".'
  code: |
    fun main() {
        val umur = 16
        val pedang = true
        println(umur >= 15 && pedang)
        val status = if (umur >= 18) "dewasa" else "muda"
        println(status)
    }
exercises:
- id: kt-f3-detik
  type: write
  title: Jam Pertarungan
  difficulty: 2
  prompt: 'Baca total detik. Cetak dalam format J:M:D tanpa nol di depan. Contoh: 3725 menjadi 1:2:5.'
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - '3725'
  - '59'
  - '86399'
  - '0'
  hints: |
    1 jam = 3600 detik, 1 menit = 60 detik.
    Jam = t / 3600, menit = (t % 3600) / 60.
    Detik = t % 60.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val d = t[0].toLong()
        println("${d / 3600}:${d % 3600 / 60}:${d % 60}")
    }
- id: kt-f3-suhu
  type: write
  title: Suhu Napas Api
  difficulty: 1
  prompt: Baca suhu Celsius (bilangan bulat). Cetak Fahrenheit dengan 1 desimal (F = C * 9 / 5 + 32).
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  tests:
  - '100'
  - '0'
  - '-40'
  - '37'
  hints: |
    Hitung dalam tipe desimal agar 37 * 9 / 5 tidak terpotong.
    Contoh: 37 menjadi 98.6.
    Format 1 angka di belakang koma.
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val c = t[0].toDouble()
        println("%.1f".format(c * 9 / 5 + 32))
    }
- id: kt-f3-predict
  type: predict
  title: Urutan Operasi
  difficulty: 2
  prompt: Tulis output persis dari program berikut.
  code: |
    fun main() {
        println("${2 + 3 * 4} ${(2 + 3) * 4}")
        println(20 - 6 / 2 % 2)
        println(7 > 3 && 2 > 5 || true)
    }
  hints: |
    * / % dikerjakan sebelum + -.
    Operator dengan derajat sama dikerjakan dari kiri.
    Kurung mengubah urutan.
  solution: x
- id: kt-f3-bug
  type: bughunt
  title: Gerbang yang Salah Jaga
  difficulty: 1
  prompt: Program harus mencetak "masuk" hanya jika 1 ≤ n ≤ 10, selain itu "tolak". Tapi semua angka masuk. Temukan baris yang salah.
  starter: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        if (n >= 1 || n <= 10) println("masuk") else println("tolak")
    }
  bug_line: 4
  tests:
  - '5'
  - '1'
  - '10'
  - '0'
  - '11'
  hints: |
    Coba n = 11: apakah kedua syarat harus benar?
    || (atau) cukup salah satu benar.
    Gunakan && (dan).
  solution: |
    fun main() {
        val t = System.`in`.bufferedReader().readText().split(Regex("\\s+")).filter { it.isNotEmpty() }
        val n = t[0].toInt()
        if (n >= 1 && n <= 10) println("masuk") else println("tolak")
    }
