lesson:
- text: Program Kotlin cukup fun main() { }. println mencetak lalu newline, print tanpa newline. Titik koma di akhir baris tidak diperlukan.
  code: |
    fun main() {
        println("Pernapasan Cinta, Bentuk Pertama")
        print("tanpa ")
        print("newline\n")
    }
- text: 'String template menyisipkan nilai: "$nama" atau "${ekspresi}". Untuk desimal berformat, pakai "%.2f".format(x).'
  code: |
    fun main() {
        val nama = "Mitsuri"
        val sakura = 8
        println("$nama makan ${sakura * 3} mochi, rata-rata ${"%.1f".format(sakura / 3.0)} per jam")
    }
exercises:
- id: kt-f1-halo
  type: write
  title: Salam Pertama
  difficulty: 1
  prompt: Cetak tepat satu baris "Halo, Slayer!".
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  hints: |
    Gunakan fungsi cetak baris bawaan bahasa ini.
    Teks harus persis sama, termasuk koma dan tanda seru.
    Satu baris saja, diakhiri newline.
  solution: |
    fun main() {
        println("Halo, Slayer!")
    }
- id: kt-f1-format
  type: write
  title: Laporan Berformat
  difficulty: 1
  prompt: Dengan string berformat, cetak "Rengoku berumur 20 tahun, kekuatan 9.50" dari variabel nama = "Rengoku", umur = 20, dan kekuatan = 9.5.
  starter: |
    fun main() {
        // tulis kodemu di sini
    }
  hints: |
    Simpan ketiga nilai dalam variabel dulu.
    Pakai format/interpolasi string, bukan menyambung manual.
    Kekuatan dicetak dengan tepat 2 angka di belakang koma.
  solution: |
    fun main() {
        val nama = "Rengoku"
        val umur = 20
        val kekuatan = 9.5
        println("$nama berumur $umur tahun, kekuatan ${"%.2f".format(kekuatan)}")
    }
- id: kt-f1-predict
  type: predict
  title: Baris yang Tidak Berganti
  difficulty: 1
  prompt: Tulis output persis dari program berikut.
  code: |
    fun main() {
        print("Kaa")
        print("!" + "!")
        println()
        println("misi " + 3 + " selesai")
        println("${2}+${3}=${2 + 3}")
        println("1" + 2 + 3)
    }
  hints: |
    Perhatikan perintah cetak mana yang menambah newline.
    Perintah tanpa newline menyambung ke baris yang sama.
    Hitung spasinya dengan teliti.
  solution: x
- id: kt-f1-bug
  type: bughunt
  title: Iblis Pemakan Tanda Kutip
  difficulty: 1
  prompt: Program harus mencetak "Kaa!" lalu "Misi!", tapi gagal dikompilasi. Temukan baris yang salah.
  starter: |
    fun main() {
        println("Kaa!")
        println("Misi!)
    }
  bug_line: 3
  hints: |
    Baca pesan error compiler: ia menunjuk nomor baris.
    Setiap string harus dibuka DAN ditutup dengan tanda kutip.
    Tambahkan tanda kutip penutup yang hilang.
  solution: |
    fun main() {
        println("Kaa!")
        println("Misi!")
    }
