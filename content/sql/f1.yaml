lesson:
- text: SELECT kolom FROM tabel mengambil kolom tertentu; * berarti semua kolom. Kolom bisa dihitung dan diberi nama baru dengan AS.
  code: |
    SELECT nama, umur, umur + 1 AS umur_depan FROM slayer ORDER BY id;
- text: DISTINCT membuang baris hasil yang kembar, berguna untuk melihat nilai-nilai berbeda dalam satu kolom.
  code: |
    SELECT DISTINCT pernapasan FROM slayer ORDER BY pernapasan;
exercises:
- id: sql-semua-nama
  type: write
  title: Daftar Anggota Korps
  difficulty: 1
  prompt: Tampilkan kolom nama dari tabel slayer, urut berdasarkan id.
  starter: |
    SELECT
  tests: &id001
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  hints: |
    Bentuk dasarnya SELECT kolom FROM tabel.
    Pengurutan memakai ORDER BY.
    SELECT nama FROM slayer ORDER BY id;
  solution: |
    SELECT nama FROM slayer ORDER BY id;
- id: sql-f1-alias
  type: write
  title: Ulang Tahun Berikutnya
  difficulty: 1
  prompt: Tampilkan nama dan umur tahun depan dengan nama kolom umur_depan, urut berdasarkan id.
  tests: *id001
  samples: 1
  hints: |
    Kolom bisa berupa ekspresi: umur + 1.
    Beri nama dengan AS umur_depan.
    Jangan lupa ORDER BY id.
  solution: |
    SELECT nama, umur + 1 AS umur_depan FROM slayer ORDER BY id;
- id: sql-f1-distinct
  type: predict
  title: Aliran yang Berbeda
  difficulty: 1
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    SELECT DISTINCT pernapasan FROM slayer ORDER BY pernapasan;
  hints: |
    DISTINCT menghapus nilai yang sama.
    Air muncul tiga kali tapi ditampilkan sekali.
    Urutan abjad: huruf A (Air, Api) duluan.
  solution: x
