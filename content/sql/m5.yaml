lesson:
- text: VIEW adalah query yang disimpan dengan nama dan dipakai seperti tabel. Isinya selalu dihitung ulang dari tabel aslinya, jadi data terbaru ikut terlihat.
  code: |
    CREATE VIEW hashira AS SELECT s.nama FROM slayer s JOIN pangkat p ON p.id = s.pangkat_id WHERE p.nama = 'Hashira';
    SELECT * FROM hashira ORDER BY nama;
exercises:
- id: sql-m5-view
  type: write
  title: Daftar Hashira
  difficulty: 2
  prompt: Buat view bernama hashira yang berisi kolom nama dan umur dari slayer berpangkat 'Hashira'. (Pemeriksa membaca view itu.)
  tests:
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  after: |
    SELECT nama, umur FROM hashira ORDER BY nama;
  hints: |
    CREATE VIEW nama AS SELECT ...
    Butuh JOIN ke tabel pangkat.
    WHERE p.nama = 'Hashira'
  solution: |
    CREATE VIEW hashira AS SELECT s.nama, s.umur FROM slayer s JOIN pangkat p ON p.id = s.pangkat_id WHERE p.nama = 'Hashira';
- id: sql-m5-rekap
  type: write
  title: Rekap Upah
  difficulty: 3
  prompt: Buat view rekap_upah berisi nama slayer dan total koban dari misi berhasil (kolom total). Slayer tanpa misi berhasil tidak perlu muncul. (Pemeriksa membaca view itu.)
  tests:
  - ''
  - INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES (8, 6, '2026-06-01', 1, 90), (3, 3, '2026-06-02', 1, 300);
  samples: 1
  after: |
    SELECT nama, total FROM rekap_upah ORDER BY total DESC, nama;
  hints: |
    View boleh berisi JOIN dan GROUP BY.
    Beri nama kolom dengan AS total.
    GROUP BY per slayer.
  solution: |
    CREATE VIEW rekap_upah AS SELECT s.nama, SUM(m.koban) AS total FROM misi m JOIN slayer s ON s.id = m.slayer_id WHERE m.berhasil = 1 GROUP BY s.id;
- id: sql-m5-hidup
  type: predict
  title: View Mengikuti Data
  difficulty: 2
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    CREATE VIEW muda AS SELECT nama FROM slayer WHERE umur < 16;
    INSERT INTO slayer (nama, umur) VALUES ('Sabito', 13);
    SELECT COUNT(*) FROM muda;
  hints: |
    View tidak menyimpan salinan data.
    Sabito dimasukkan SETELAH view dibuat.
    Hitung slayer dengan umur < 16 termasuk Sabito.
  solution: x
