lesson:
- text: Query plan memperlihatkan strategi SQLite. SCAN berarti membaca semua baris; SEARCH ... USING INDEX berarti melompat langsung lewat index. Untuk tabel besar, perbedaannya bisa ribuan kali lipat.
  code: |
    CREATE INDEX idx_slayer_umur ON slayer(umur);
    EXPLAIN QUERY PLAN SELECT nama FROM slayer WHERE umur = 15;
exercises:
- id: sql-l3-search
  type: predict
  title: Lompat Lewat Index
  difficulty: 2
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    CREATE INDEX idx_misi_slayer ON misi(slayer_id);
    EXPLAIN QUERY PLAN SELECT koban FROM misi WHERE slayer_id = 1;
  hints: |
    Index dibuat pada slayer_id.
    WHERE slayer_id = 1 bisa memakai index itu.
    Teks rencana: SEARCH misi USING INDEX ...
  solution: x
- id: sql-l3-pilih
  type: write
  title: Pilih Index yang Tepat
  difficulty: 3
  prompt: 'Query yang sering dipakai: SELECT nama FROM slayer WHERE pernapasan = ? AND umur > ?. Buat index bernama idx_aliran_umur yang membuat query ini memakai index untuk KEDUA kolom. (Pemeriksa menjalankan
    EXPLAIN QUERY PLAN.)'
  after: |
    EXPLAIN QUERY PLAN SELECT nama FROM slayer WHERE pernapasan = 'Air' AND umur > 16;
  hints: |
    Index bisa berisi beberapa kolom.
    Kolom yang dibandingkan dengan = diletakkan duluan.
    ON slayer(pernapasan, umur)
  solution: |
    CREATE INDEX idx_aliran_umur ON slayer(pernapasan, umur);
