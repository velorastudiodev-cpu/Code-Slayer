lesson:
- text: 'Window function menghitung nilai dari "jendela" baris tanpa menggabungkannya seperti GROUP BY: ROW_NUMBER(), RANK(), SUM() OVER (...). PARTITION BY membagi jendela per kelompok, ORDER BY di dalam
    OVER menentukan urutannya.'
  code: |
    SELECT nama, pernapasan, umur, ROW_NUMBER() OVER (PARTITION BY pernapasan ORDER BY umur DESC, nama) AS ke FROM slayer ORDER BY pernapasan, ke;
- text: SUM(..) OVER (ORDER BY ..) menghasilkan total berjalan (running total). LAG(kolom) mengambil nilai dari baris sebelumnya.
  code: |
    SELECT tanggal, koban, SUM(koban) OVER (ORDER BY id) AS kumulatif, LAG(koban) OVER (ORDER BY id) AS sebelumnya FROM misi WHERE berhasil = 1 ORDER BY id;
exercises:
- id: sql-l1-rownum
  type: write
  title: Tertua per Aliran
  difficulty: 3
  prompt: Tampilkan pernapasan, nama, dan umur slayer TERTUA di setiap pernapasan (kalau sama umur, ambil nama terkecil secara abjad), urut pernapasan.
  tests:
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  hints: |
    ROW_NUMBER() OVER (PARTITION BY pernapasan ORDER BY umur DESC, nama).
    Bungkus dalam subquery, lalu ambil rn = 1.
    Urutkan hasil akhir per pernapasan.
  solution: |
    SELECT pernapasan, nama, umur FROM (SELECT pernapasan, nama, umur, ROW_NUMBER() OVER (PARTITION BY pernapasan ORDER BY umur DESC, nama) AS rn FROM slayer) WHERE rn = 1 ORDER BY pernapasan;
- id: sql-l1-kumulatif
  type: write
  title: Upah Kumulatif
  difficulty: 3
  prompt: Untuk misi yang berhasil, tampilkan id, koban, dan total koban kumulatif (kolom kumulatif) berdasarkan urutan id.
  tests:
  - ''
  - INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES (8, 6, '2026-06-01', 1, 90), (3, 3, '2026-06-02', 1, 300);
  samples: 1
  hints: |
    Total berjalan = SUM(...) OVER (ORDER BY ...).
    Saring berhasil = 1 di WHERE.
    ORDER BY id di dalam OVER dan di akhir query.
  solution: |
    SELECT id, koban, SUM(koban) OVER (ORDER BY id) AS kumulatif FROM misi WHERE berhasil = 1 ORDER BY id;
- id: sql-l1-rank
  type: write
  title: Peringkat Pemburu
  difficulty: 3
  prompt: Hitung total koban per slayer (misi berhasil), lalu tampilkan nama, total, dan peringkat (kolom peringkat, RANK dari total terbesar). Urut peringkat lalu nama.
  tests:
  - ''
  - INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES (8, 6, '2026-06-01', 1, 90), (3, 3, '2026-06-02', 1, 300);
  samples: 1
  hints: |
    Kelompokkan per slayer dulu (GROUP BY).
    RANK() OVER (ORDER BY SUM(koban) DESC).
    Window function dihitung setelah GROUP BY.
  solution: |
    SELECT s.nama, SUM(m.koban) AS total, RANK() OVER (ORDER BY SUM(m.koban) DESC) AS peringkat FROM misi m JOIN slayer s ON s.id = m.slayer_id WHERE m.berhasil = 1 GROUP BY s.id ORDER BY peringkat, s.nama;
