lesson:
- text: 'ORDER BY mengurutkan hasil; ASC menaik (bawaan), DESC menurun. Beberapa kolom: urut kolom pertama dulu, lalu kolom kedua untuk nilai yang sama.'
  code: |
    SELECT nama, pernapasan, umur FROM slayer ORDER BY pernapasan, umur DESC;
- text: LIMIT n membatasi jumlah baris; OFFSET k melewati k baris pertama. Selalu pasangkan dengan ORDER BY supaya hasilnya pasti.
  code: |
    SELECT nama, umur FROM slayer ORDER BY umur DESC, nama LIMIT 2 OFFSET 1;
exercises:
- id: sql-f3-termuda
  type: write
  title: Tiga Termuda
  difficulty: 1
  prompt: Tampilkan nama dan umur 3 slayer termuda. Kalau umurnya sama, urut nama.
  tests: &id001
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  hints: |
    Urutkan dari umur terkecil.
    Tambahkan nama sebagai kunci kedua.
    LIMIT 3.
  solution: |
    SELECT nama, umur FROM slayer ORDER BY umur, nama LIMIT 3;
- id: sql-f3-ganda
  type: write
  title: Barisan per Aliran
  difficulty: 2
  prompt: 'Tampilkan pernapasan, nama, dan umur semua slayer: urut pernapasan (A-Z), lalu umur dari yang TERTUA, lalu nama.'
  tests: *id001
  samples: 1
  hints: |
    ORDER BY boleh berisi beberapa kolom.
    DESC hanya berlaku untuk kolom yang ditulisinya.
    ORDER BY pernapasan, umur DESC, nama
  solution: |
    SELECT pernapasan, nama, umur FROM slayer ORDER BY pernapasan, umur DESC, nama;
- id: sql-f3-offset
  type: predict
  title: Melewati Barisan
  difficulty: 2
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    SELECT nama FROM slayer ORDER BY umur DESC, nama LIMIT 2 OFFSET 2;
  hints: |
    Urutkan dulu dari umur tertua.
    OFFSET 2 melewati dua baris pertama.
    LIMIT 2 mengambil dua baris berikutnya.
  solution: x
