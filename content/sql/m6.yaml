lesson:
- text: 'Transaksi mengelompokkan beberapa perubahan menjadi satu: BEGIN, lalu perubahan, lalu COMMIT untuk menyimpan semuanya atau ROLLBACK untuk membatalkan semuanya. Cocok untuk transfer saldo: tidak
    boleh setengah jadi.'
  code: |
    BEGIN;
    UPDATE dompet SET saldo = saldo - 50 WHERE nama = 'Tanjiro';
    UPDATE dompet SET saldo = saldo + 50 WHERE nama = 'Zenitsu';
    COMMIT;
    SELECT * FROM dompet;
exercises:
- id: sql-m6-transfer
  type: write
  title: Transfer Koban
  difficulty: 2
  prompt: Dalam satu transaksi, pindahkan 100 koban dari 'Kas Korps' ke 'Tanjiro'. (Saldo semua dompet diperiksa setelah kodemu.)
  after: |
    SELECT nama, saldo FROM dompet ORDER BY nama;
  hints: |
    Mulai dengan BEGIN, akhiri dengan COMMIT.
    Dua UPDATE: kurangi pengirim, tambah penerima.
    Periksa WHERE nama di setiap UPDATE.
  solution: |
    BEGIN;
    UPDATE dompet SET saldo = saldo - 100 WHERE nama = 'Kas Korps';
    UPDATE dompet SET saldo = saldo + 100 WHERE nama = 'Tanjiro';
    COMMIT;
- id: sql-m6-rollback
  type: predict
  title: Transaksi Dibatalkan
  difficulty: 2
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    BEGIN;
    UPDATE dompet SET saldo = 0 WHERE nama = 'Zenitsu';
    ROLLBACK;
    SELECT saldo FROM dompet WHERE nama = 'Zenitsu';
  hints: |
    ROLLBACK membatalkan semua perubahan sejak BEGIN.
    Saldo kembali seperti sebelum BEGIN.
    Lihat data awal tabel dompet.
  solution: x
- id: sql-m6-bug
  type: bughunt
  title: Koban yang Menguap
  difficulty: 2
  prompt: Transfer 50 koban dari Zenitsu ke Tanjiro, tapi total koban di semua dompet berkurang 50. Temukan baris yang salah.
  starter: |
    BEGIN;
    UPDATE dompet SET saldo = saldo - 50 WHERE nama = 'Zenitsu';
    UPDATE dompet SET saldo = saldo - 50 WHERE nama = 'Tanjiro';
    COMMIT;
  bug_line: 3
  after: |
    SELECT nama, saldo FROM dompet ORDER BY nama;
  hints: |
    Total semua saldo harus tetap sama setelah transfer.
    Penerima seharusnya bertambah, bukan berkurang.
    saldo = saldo + 50 untuk Tanjiro.
  solution: |
    BEGIN;
    UPDATE dompet SET saldo = saldo - 50 WHERE nama = 'Zenitsu';
    UPDATE dompet SET saldo = saldo + 50 WHERE nama = 'Tanjiro';
    COMMIT;
