lesson:
- text: WITH (Common Table Expression) memberi nama pada subquery supaya query panjang lebih mudah dibaca. CTE bisa dipakai beberapa kali dalam query utama.
  code: |
    WITH upah AS (SELECT slayer_id, SUM(koban) AS total FROM misi GROUP BY slayer_id)
    SELECT s.nama, u.total FROM upah u JOIN slayer s ON s.id = u.slayer_id ORDER BY u.total DESC;
- text: 'WITH RECURSIVE membuat CTE yang merujuk dirinya sendiri: bagian awal (anchor) UNION ALL bagian rekursif, sampai tidak ada baris baru. Cocok untuk deret dan hierarki (guru-murid).'
  code: |
    WITH RECURSIVE n(x) AS (SELECT 1 UNION ALL SELECT x + 1 FROM n WHERE x < 5)
    SELECT group_concat(x) FROM n;
exercises:
- id: sql-l2-cte
  type: write
  title: Aliran Paling Berharga
  difficulty: 3
  prompt: Dengan CTE, hitung total koban misi berhasil per pernapasan, lalu tampilkan pernapasan dan total untuk total di atas 200, urut total terbesar.
  tests:
  - ''
  - INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES (8, 6, '2026-06-01', 1, 90), (3, 3, '2026-06-02', 1, 300);
  samples: 1
  hints: |
    WITH nama AS (SELECT ...) lalu SELECT dari nama itu.
    Di dalam CTE: JOIN misi-slayer, GROUP BY pernapasan.
    Saring total > 200 di query utama.
  solution: |
    WITH per_aliran AS (SELECT s.pernapasan, SUM(m.koban) AS total FROM misi m JOIN slayer s ON s.id = m.slayer_id WHERE m.berhasil = 1 GROUP BY s.pernapasan)
    SELECT pernapasan, total FROM per_aliran WHERE total > 200 ORDER BY total DESC;
- id: sql-l2-deret
  type: predict
  title: Deret Pangkat Dua
  difficulty: 2
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    WITH RECURSIVE p(n) AS (SELECT 1 UNION ALL SELECT n * 2 FROM p WHERE n < 100)
    SELECT group_concat(n, ' ') FROM p;
  hints: |
    Mulai dari 1.
    Setiap langkah dikali 2 selama n < 100.
    64 < 100 masih lanjut ke 128, lalu berhenti.
  solution: x
- id: sql-l2-murid
  type: write
  title: Silsilah Urokodaki
  difficulty: 3
  prompt: Dengan WITH RECURSIVE, tampilkan semua murid (langsung maupun tidak langsung) dari 'Urokodaki' di tabel guru, urut nama.
  tests:
  - ''
  - INSERT INTO guru VALUES ('Genya', 'Murata');
  samples: 1
  hints: |
    Anchor: murid langsung Urokodaki.
    Bagian rekursif: siapa yang gurunya ada di hasil sebelumnya.
    JOIN guru g ON g.guru = m.nama
  solution: |
    WITH RECURSIVE murid(nama) AS (
      SELECT murid FROM guru WHERE guru = 'Urokodaki'
      UNION ALL
      SELECT g.murid FROM guru g JOIN murid m ON g.guru = m.nama
    )
    SELECT nama FROM murid ORDER BY nama;
