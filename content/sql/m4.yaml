lesson:
- text: 'Index mempercepat pencarian seperti indeks di buku: CREATE INDEX nama ON tabel(kolom). EXPLAIN QUERY PLAN menunjukkan apakah database memakai index (SEARCH ... USING INDEX) atau membaca seluruh
    tabel (SCAN).'
  code: |
    EXPLAIN QUERY PLAN SELECT * FROM misi WHERE tanggal = '2026-03-15';
exercises:
- id: sql-m4-index
  type: write
  title: Indeks Tanggal Misi
  difficulty: 2
  prompt: Buat index bernama idx_misi_tanggal pada kolom tanggal di tabel misi. (Pemeriksa menjalankan EXPLAIN QUERY PLAN untuk pencarian berdasarkan tanggal.)
  after: |
    EXPLAIN QUERY PLAN SELECT * FROM misi WHERE tanggal = '2026-03-15';
  hints: |
    CREATE INDEX nama ON tabel(kolom).
    Nama index harus persis idx_misi_tanggal.
    Kolomnya tanggal.
  solution: |
    CREATE INDEX idx_misi_tanggal ON misi(tanggal);
- id: sql-m4-scan
  type: predict
  title: Membaca Seluruh Tabel
  difficulty: 1
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    EXPLAIN QUERY PLAN SELECT * FROM slayer WHERE umur = 15;
  hints: |
    Belum ada index untuk kolom umur.
    Tanpa index, SQLite membaca semua baris.
    Kolom terakhir berisi teks rencana: SCAN ...
  solution: x
- id: sql-m4-unique
  type: write
  title: Index Unik
  difficulty: 2
  prompt: Buat UNIQUE INDEX bernama idx_iblis_nama pada iblis(nama). (Pemeriksa mencoba memasukkan nama iblis kembar.)
  after: |
    INSERT OR IGNORE INTO iblis (nama, peringkat) VALUES ('Akaza', 'Tiruan'), ('Kaigaku', 'Upper Moon 6');
    SELECT nama FROM iblis ORDER BY nama;
  hints: |
    UNIQUE INDEX sekaligus menolak nilai kembar.
    CREATE UNIQUE INDEX nama ON tabel(kolom).
    Namanya idx_iblis_nama.
  solution: |
    CREATE UNIQUE INDEX idx_iblis_nama ON iblis(nama);
