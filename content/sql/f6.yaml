setup: |
  CREATE TABLE pangkat (id INTEGER PRIMARY KEY, nama TEXT NOT NULL, urutan INTEGER NOT NULL);
  INSERT INTO pangkat VALUES (1, 'Mizunoto', 1), (2, 'Kanoe', 4), (3, 'Kinoe', 10), (4, 'Hashira', 11);
  CREATE TABLE slayer (id INTEGER PRIMARY KEY, nama TEXT NOT NULL, pernapasan TEXT, umur INTEGER, pangkat_id INTEGER);
  INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES
    ('Tanjiro', 'Air', 15, 2), ('Zenitsu', 'Petir', 16, 2), ('Inosuke', 'Binatang', 15, 2), ('Giyu', 'Air', 21, 4),
    ('Rengoku', 'Api', 20, 4), ('Shinobu', 'Serangga', 18, 4), ('Kanao', 'Bunga', 16, 3), ('Murata', 'Air', 19, 1);
  CREATE TABLE iblis (id INTEGER PRIMARY KEY, nama TEXT NOT NULL, peringkat TEXT);
  INSERT INTO iblis VALUES (1, 'Rui', 'Lower Moon 5'), (2, 'Enmu', 'Lower Moon 1'), (3, 'Akaza', 'Upper Moon 3'), (4, 'Daki', 'Upper Moon 6'), (5, 'Iblis Rawa', NULL), (6, 'Gyokko', 'Upper Moon 5');
  CREATE TABLE misi (id INTEGER PRIMARY KEY, slayer_id INTEGER, iblis_id INTEGER, tanggal TEXT, berhasil INTEGER, koban INTEGER);
  INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES
    (1, 5, '2026-01-10', 1, 50), (1, 1, '2026-02-03', 1, 120), (2, 5, '2026-01-10', 1, 40), (3, 5, '2026-01-11', 0, 0),
    (1, 2, '2026-03-15', 1, 200), (5, 2, '2026-03-15', 1, 250), (5, 3, '2026-03-16', 0, 0), (4, 1, '2026-02-03', 1, 150),
    (7, 4, '2026-04-20', 1, 180), (2, 4, '2026-04-20', 1, 160), (6, 5, '2026-05-02', 1, 60);
  CREATE TABLE dompet (nama TEXT PRIMARY KEY, saldo INTEGER NOT NULL);
  INSERT INTO dompet VALUES ('Tanjiro', 300), ('Zenitsu', 120), ('Kas Korps', 1000);
  CREATE TABLE guru (murid TEXT PRIMARY KEY, guru TEXT);
  INSERT INTO guru VALUES ('Urokodaki', NULL), ('Sabito', 'Urokodaki'), ('Giyu', 'Urokodaki'), ('Tanjiro', 'Urokodaki'), ('Murata', 'Giyu'), ('Kanae', NULL), ('Shinobu', 'Kanae'), ('Kanao', 'Shinobu');
lesson:
- text: 'JOIN menggabungkan baris dari dua tabel lewat kolom yang berhubungan. Alias tabel (slayer s) membuat query lebih ringkas: s.nama, p.nama.'
  code: |
    SELECT s.nama, p.nama AS pangkat FROM slayer s JOIN pangkat p ON p.id = s.pangkat_id ORDER BY s.id;
- text: LEFT JOIN tetap menampilkan semua baris tabel kiri; kolom tabel kanan bernilai NULL kalau tidak ada pasangannya. Cocok untuk mencari yang "belum punya".
  code: |
    SELECT s.nama, COUNT(m.id) FROM slayer s LEFT JOIN misi m ON m.slayer_id = s.id GROUP BY s.id ORDER BY s.id;
exercises:
- id: sql-f6-pangkat
  type: write
  title: Nama dan Pangkat
  difficulty: 1
  prompt: Tampilkan nama slayer dan nama pangkatnya (kolom pangkat), urut id slayer.
  tests: &id001
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  hints: |
    Hubungkan slayer.pangkat_id dengan pangkat.id.
    Pakai alias supaya jelas kolom nama mana yang dimaksud.
    JOIN pangkat p ON p.id = s.pangkat_id
  solution: |
    SELECT s.nama, p.nama AS pangkat FROM slayer s JOIN pangkat p ON p.id = s.pangkat_id ORDER BY s.id;
- id: sql-f6-laporan
  type: write
  title: Laporan Misi
  difficulty: 2
  prompt: Tampilkan tanggal, nama slayer, dan nama iblis untuk setiap misi yang berhasil, urut tanggal lalu nama slayer.
  tests:
  - ''
  - INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES (8, 6, '2026-06-01', 1, 90), (3, 3, '2026-06-02', 1, 300);
  samples: 1
  hints: |
    Butuh tiga tabel: misi, slayer, iblis.
    Dua JOIN berurutan.
    Saring berhasil = 1 lalu ORDER BY m.tanggal, s.nama.
  solution: |
    SELECT m.tanggal, s.nama, i.nama FROM misi m JOIN slayer s ON s.id = m.slayer_id JOIN iblis i ON i.id = m.iblis_id WHERE m.berhasil = 1 ORDER BY m.tanggal, s.nama;
- id: sql-f6-kosong
  type: write
  title: Belum Pernah Bertugas
  difficulty: 2
  prompt: Tampilkan nama slayer yang belum pernah punya misi sama sekali, urut nama.
  tests: *id001
  samples: 1
  hints: |
    LEFT JOIN mempertahankan semua slayer.
    Slayer tanpa misi punya m.id NULL.
    WHERE m.id IS NULL
  solution: |
    SELECT s.nama FROM slayer s LEFT JOIN misi m ON m.slayer_id = s.id WHERE m.id IS NULL ORDER BY s.nama;
- id: sql-f6-parsons
  type: parsons
  title: Susun Query Hashira
  difficulty: 1
  prompt: Susun query yang menampilkan nama slayer berpangkat dengan urutan ≥ 10, urut nama.
  tests: *id001
  hints: |
    Urutan klausa: SELECT, FROM, JOIN, WHERE, ORDER BY.
    JOIN langsung setelah FROM.
    ORDER BY selalu terakhir.
  solution: |
    SELECT s.nama
    FROM slayer s
    JOIN pangkat p ON p.id = s.pangkat_id
    WHERE p.urutan >= 10
    ORDER BY s.nama;
