lesson:
- text: GROUP BY mengelompokkan baris yang nilainya sama, lalu agregat dihitung per kelompok. Kolom yang ditampilkan harus kolom pengelompokan atau hasil agregat.
  code: |
    SELECT pernapasan, COUNT(*) AS jumlah FROM slayer GROUP BY pernapasan ORDER BY jumlah DESC, pernapasan;
- text: HAVING menyaring KELOMPOK (setelah agregat), sedangkan WHERE menyaring BARIS (sebelum dikelompokkan).
  code: |
    SELECT slayer_id, SUM(koban) FROM misi WHERE berhasil = 1 GROUP BY slayer_id HAVING SUM(koban) > 150;
exercises:
- id: sql-f5-aliran
  type: write
  title: Sensus Pernapasan
  difficulty: 1
  prompt: Tampilkan setiap pernapasan dan banyak slayer-nya (kolom jumlah), urut jumlah terbanyak lalu nama pernapasan.
  tests: &id001
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  hints: |
    Kelompokkan dengan GROUP BY pernapasan.
    COUNT(*) per kelompok.
    ORDER BY jumlah DESC, pernapasan
  solution: |
    SELECT pernapasan, COUNT(*) AS jumlah FROM slayer GROUP BY pernapasan ORDER BY jumlah DESC, pernapasan;
- id: sql-f5-having
  type: write
  title: Aliran Ramai
  difficulty: 2
  prompt: Tampilkan pernapasan yang dipakai lebih dari satu slayer, urut nama pernapasan.
  tests: *id001
  samples: 1
  hints: |
    Syarat pada hasil agregat memakai HAVING.
    HAVING ditulis setelah GROUP BY.
    HAVING COUNT(*) > 1
  solution: |
    SELECT pernapasan FROM slayer GROUP BY pernapasan HAVING COUNT(*) > 1 ORDER BY pernapasan;
- id: sql-f5-upah
  type: write
  title: Upah per Slayer
  difficulty: 2
  prompt: Tampilkan slayer_id dan total koban (kolom total) dari misi yang berhasil, urut total terbesar lalu slayer_id.
  tests:
  - ''
  - INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES (8, 6, '2026-06-01', 1, 90), (3, 3, '2026-06-02', 1, 300);
  samples: 1
  hints: |
    Saring misi berhasil dengan WHERE.
    Kelompokkan per slayer_id.
    Urutkan dengan ORDER BY total DESC, slayer_id.
  solution: |
    SELECT slayer_id, SUM(koban) AS total FROM misi WHERE berhasil = 1 GROUP BY slayer_id ORDER BY total DESC, slayer_id;
- id: sql-f5-bug
  type: bughunt
  title: WHERE atau HAVING?
  difficulty: 2
  prompt: Query harus menampilkan pernapasan yang dipakai lebih dari satu slayer (urut nama), tapi error. Temukan baris yang salah.
  starter: |
    SELECT pernapasan
    FROM slayer
    GROUP BY pernapasan
    WHERE COUNT(*) > 1
    ORDER BY pernapasan;
  bug_line: 4
  tests: *id001
  hints: |
    WHERE menyaring baris SEBELUM dikelompokkan, jadi tidak boleh berisi agregat.
    Syarat untuk kelompok memakai HAVING, setelah GROUP BY.
    Ganti WHERE dengan HAVING.
  solution: |
    SELECT pernapasan
    FROM slayer
    GROUP BY pernapasan
    HAVING COUNT(*) > 1
    ORDER BY pernapasan;
