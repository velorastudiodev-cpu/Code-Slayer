lesson:
- text: 'Constraint menjaga data tetap valid: NOT NULL (wajib diisi), UNIQUE (tidak boleh kembar), CHECK (syarat bebas), PRIMARY KEY (unik dan wajib). Pelanggaran membuat INSERT ditolak.'
  code: |
    CREATE TABLE akun (email TEXT NOT NULL UNIQUE, umur INTEGER CHECK (umur >= 0));
    INSERT INTO akun VALUES ('a@korps.id', 15);
    INSERT OR IGNORE INTO akun VALUES ('a@korps.id', 16);
    SELECT COUNT(*) FROM akun;
exercises:
- id: sql-m3-unique
  type: write
  title: Satu Email Satu Akun
  difficulty: 2
  prompt: Buat tabel akun dengan kolom email (TEXT) yang wajib diisi dan tidak boleh kembar, serta nama (TEXT). (Pemeriksa mencoba memasukkan email kembar dan email NULL.)
  after: |
    INSERT OR IGNORE INTO akun VALUES ('t@korps.id', 'Tanjiro'), ('t@korps.id', 'Tiruan'), (NULL, 'Tanpa Email'), ('z@korps.id', 'Zenitsu');
    SELECT email, nama FROM akun ORDER BY email;
  hints: |
    NOT NULL: wajib diisi.
    UNIQUE: tidak boleh ada dua yang sama.
    email TEXT NOT NULL UNIQUE
  solution: |
    CREATE TABLE akun (email TEXT NOT NULL UNIQUE, nama TEXT);
- id: sql-m3-check
  type: write
  title: Umur Tidak Boleh Negatif
  difficulty: 2
  prompt: Buat tabel kadet dengan kolom nama (TEXT) dan umur (INTEGER) yang harus antara 10 dan 30. (Pemeriksa mencoba memasukkan umur di luar batas.)
  after: |
    INSERT OR IGNORE INTO kadet VALUES ('Tanjiro', 15), ('Bayi', 2), ('Kakek', 80), ('Kanao', 16), ('Batas', 30);
    SELECT nama FROM kadet ORDER BY nama;
  hints: |
    CHECK (syarat) ditulis setelah tipe kolom.
    Syarat boleh memakai BETWEEN.
    CHECK (umur BETWEEN 10 AND 30)
  solution: |
    CREATE TABLE kadet (nama TEXT, umur INTEGER CHECK (umur BETWEEN 10 AND 30));
- id: sql-m3-bug
  type: bughunt
  title: Kunci yang Bisa Kembar
  difficulty: 2
  prompt: Tabel pedang seharusnya menolak kode yang sama dua kali, tapi duplikat tetap masuk. Temukan baris yang salah.
  starter: |
    CREATE TABLE pedang (
      kode TEXT,
      pemilik TEXT
    );
  bug_line: 2
  after: |
    INSERT OR IGNORE INTO pedang VALUES ('N-001', 'Tanjiro'), ('N-001', 'Pencuri'), ('N-002', 'Giyu');
    SELECT kode, pemilik FROM pedang ORDER BY kode;
  hints: |
    Kolom mana yang harus unik?
    Tanpa constraint, data kembar diterima.
    Jadikan kode PRIMARY KEY.
  solution: |
    CREATE TABLE pedang (
      kode TEXT PRIMARY KEY,
      pemilik TEXT
    );
