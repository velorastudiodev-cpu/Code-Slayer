lesson:
- text: INSERT INTO menambah baris, UPDATE ... SET mengubah, DELETE FROM menghapus. UPDATE dan DELETE tanpa WHERE mengenai SEMUA baris, jadi selalu periksa WHERE-nya.
  code: |
    INSERT INTO slayer (nama, pernapasan, umur) VALUES ('Genya', 'Angin', 16);
    UPDATE slayer SET umur = umur + 1 WHERE nama = 'Genya';
    SELECT nama, umur FROM slayer WHERE nama = 'Genya';
exercises:
- id: sql-m1-insert
  type: write
  title: Anggota Baru
  difficulty: 1
  prompt: Tambahkan slayer bernama 'Genya' dengan pernapasan 'Angin', umur 16, dan pangkat_id 1. (Daftar nama akan diperiksa setelah kodemu.)
  tests: &id001
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  after: |
    SELECT nama, pernapasan, umur, pangkat_id FROM slayer ORDER BY id;
  hints: |
    INSERT INTO tabel (kolom, ...) VALUES (nilai, ...).
    id terisi otomatis kalau tidak ditulis.
    Urutan nilai harus sama dengan urutan kolom.
  solution: |
    INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Genya', 'Angin', 16, 1);
- id: sql-m1-update
  type: write
  title: Ulang Tahun Aliran Air
  difficulty: 1
  prompt: Tambah 1 tahun ke umur semua slayer pernapasan 'Air'. (Hasil diperiksa setelah kodemu.)
  tests: *id001
  samples: 1
  after: |
    SELECT nama, umur FROM slayer ORDER BY id;
  hints: |
    UPDATE tabel SET kolom = nilai WHERE syarat.
    Nilai baru boleh dihitung dari nilai lama.
    umur = umur + 1 WHERE pernapasan = 'Air'
  solution: |
    UPDATE slayer SET umur = umur + 1 WHERE pernapasan = 'Air';
- id: sql-m1-delete
  type: write
  title: Hapus Misi Gagal
  difficulty: 1
  prompt: Hapus semua misi yang gagal (berhasil = 0). (Isi tabel misi diperiksa setelah kodemu.)
  tests:
  - ''
  - INSERT INTO misi (slayer_id, iblis_id, tanggal, berhasil, koban) VALUES (2, 3, '2026-06-03', 0, 0);
  samples: 1
  after: |
    SELECT id, berhasil FROM misi ORDER BY id;
  hints: |
    DELETE FROM tabel WHERE syarat.
    Tanpa WHERE semua baris terhapus!
    WHERE berhasil = 0
  solution: |
    DELETE FROM misi WHERE berhasil = 0;
- id: sql-m1-bug
  type: bughunt
  title: Kenaikan Pangkat Massal
  difficulty: 2
  prompt: Hanya Tanjiro yang seharusnya naik ke pangkat_id 3, tapi semua slayer ikut naik. Temukan baris yang salah.
  starter: |
    UPDATE slayer
    SET pangkat_id = 3
    WHERE nama = nama;
  bug_line: 3
  tests: *id001
  after: |
    SELECT nama, pangkat_id FROM slayer ORDER BY id;
  hints: |
    nama = nama selalu benar untuk setiap baris.
    Bandingkan dengan teks yang tepat.
    WHERE nama = 'Tanjiro'
  solution: |
    UPDATE slayer
    SET pangkat_id = 3
    WHERE nama = 'Tanjiro';
