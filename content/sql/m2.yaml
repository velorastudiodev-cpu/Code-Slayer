lesson:
- text: 'CREATE TABLE mendefinisikan kolom dan tipenya. INTEGER PRIMARY KEY di SQLite otomatis bernomor. Pilih tipe yang sesuai: INTEGER, REAL, TEXT.'
  code: |
    CREATE TABLE gagak (id INTEGER PRIMARY KEY, nama TEXT, tuan TEXT);
    INSERT INTO gagak (nama, tuan) VALUES ('Matsuemon', 'Tanjiro');
    SELECT * FROM gagak;
- text: ALTER TABLE menambah kolom ke tabel yang sudah ada. Baris lama mendapat nilai DEFAULT (atau NULL kalau tidak ada default).
  code: |
    ALTER TABLE slayer ADD COLUMN aktif INTEGER DEFAULT 1;
    SELECT nama, aktif FROM slayer LIMIT 2;
exercises:
- id: sql-m2-create
  type: write
  title: Buku Gagak Kasugai
  difficulty: 2
  prompt: Buat tabel gagak dengan kolom id (INTEGER PRIMARY KEY), nama (TEXT), dan tuan (TEXT). (Data contoh dimasukkan dan dibaca setelah kodemu.)
  after: |
    INSERT INTO gagak (nama, tuan) VALUES ('Matsuemon', 'Tanjiro'), ('Chuntaro', 'Zenitsu');
    SELECT id, nama, tuan FROM gagak ORDER BY id;
  hints: |
    CREATE TABLE nama (kolom tipe, ...).
    INTEGER PRIMARY KEY bernomor otomatis.
    Tiga kolom: id, nama, tuan.
  solution: |
    CREATE TABLE gagak (id INTEGER PRIMARY KEY, nama TEXT, tuan TEXT);
- id: sql-m2-alter
  type: write
  title: Kolom Status Aktif
  difficulty: 2
  prompt: Tambahkan kolom aktif (INTEGER) ke tabel slayer dengan nilai bawaan 1. (Diperiksa setelah kodemu.)
  tests:
  - ''
  - INSERT INTO slayer (nama, pernapasan, umur, pangkat_id) VALUES ('Sabito', 'Air', 13, 1), ('Mitsuri', 'Cinta', 19, 4);
  samples: 1
  after: |
    SELECT nama, aktif FROM slayer ORDER BY id;
  hints: |
    ALTER TABLE tabel ADD COLUMN kolom tipe.
    Nilai bawaan ditulis dengan DEFAULT.
    DEFAULT 1
  solution: |
    ALTER TABLE slayer ADD COLUMN aktif INTEGER DEFAULT 1;
- id: sql-m2-typeof
  type: predict
  title: Tipe yang Tersimpan
  difficulty: 2
  prompt: Dengan dataset bab ini, apa hasil query berikut? Tulis persis seperti tabel hasil (kolom dipisah |).
  code: |
    SELECT typeof(umur), typeof(nama), typeof(pangkat_id), typeof(umur / 2.0) FROM slayer WHERE id = 1;
  hints: |
    typeof() menyebut tipe nilai yang tersimpan.
    Angka bulat = integer, teks = text.
    Pembagian dengan 2.0 menghasilkan real.
  solution: x
