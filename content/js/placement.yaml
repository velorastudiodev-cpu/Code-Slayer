- id: js-m6-1
  chapter: m6
  prompt: Apa output kode ini?
  code: |
    class Slayer {
      constructor(n) { this.n = n }
      sapa() { return `Aku ${this.n}` }
    }
    console.log(new Slayer("Tanjiro").sapa())
  options: ["Aku Tanjiro", "Aku undefined", "Aku n", "Error"]
  explain: constructor menyimpan n ke this, lalu dipakai method.
- id: js-m6-2
  chapter: m6
  prompt: Apa output kode ini?
  code: |
    class A { nama() { return "A" } }
    class B extends A { nama() { return super.nama() + "B" } }
    console.log(new B().nama())
  options: ['"AB"', '"B"', '"A"', '"BA"']
  explain: super.nama() memanggil method milik induk.
