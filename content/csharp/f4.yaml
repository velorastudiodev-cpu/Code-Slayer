lesson:
- text: 'Console.ReadLine() membaca satu baris (tanpa newline). Untuk input yang dipisah spasi, pecah dengan Split. Membaca seluruh input sekaligus: Console.In.ReadToEnd().'
  code: |
    using System;

    class Program
    {
        static void Main()
        {
            var bagian = "3 4".Split(' ');
            int a = int.Parse(bagian[0]), b = int.Parse(bagian[1]);
            Console.WriteLine(a + b);
        }
    }
- text: 'ReadLine mengembalikan null kalau input sudah habis, jadi bisa dipakai untuk membaca sampai akhir: while ((baris = Console.ReadLine()) != null). Trim() membuang spasi di ujung.'
  code: |
    using System;

    class Program
    {
        static void Main()
        {
            string baris = "  21  ";
            Console.WriteLine($"[{baris.Trim()}]");
        }
    }
exercises:
- id: cs-f4-jumlah
  type: write
  title: Menjumlah Dua Bilah
  difficulty: 1
  prompt: Baca dua bilangan bulat (dalam satu baris), cetak jumlahnya.
  starter: |
    using System;

    class Program
    {
        static void Main()
        {
            // tulis kodemu di sini
        }
    }
  tests:
  - 3 4
  - 10 -2
  - 0 0
  hints: |
    Baca dua bilangan dari input.
    Ubah teks menjadi angka.
    Cetak a + b.
  solution: |
    using System;

    class Program
    {
        static void Main()
        {
            var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
            long a = long.Parse(t[0]), b = long.Parse(t[1]);
            Console.WriteLine(a + b);
        }
    }
- id: cs-f4-n
  type: write
  title: Laporan Berjumlah n
  difficulty: 2
  prompt: Baris pertama berisi n, baris kedua berisi n bilangan. Cetak jumlah dan nilai terbesarnya, dipisah spasi.
  starter: |
    using System;

    class Program
    {
        static void Main()
        {
            // tulis kodemu di sini
        }
    }
  tests:
  - |-
    3
    1 9 2
  - |-
    1
    -5
  - |-
    5
    -1 -2 -3 -4 -5
  hints: |
    Nilai terbesar awal = bilangan pertama, bukan 0.
    Ingat bilangan bisa negatif semua.
    Cetak "<jumlah> <maks>".
  solution: |
    using System;

    class Program
    {
        static void Main()
        {
            var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
            int n = int.Parse(t[0]);
            long total = 0, maks = long.Parse(t[1]);
            for (int i = 1; i <= n; i++)
            {
                long x = long.Parse(t[i]);
                total += x;
                if (x > maks) maks = x;
            }
            Console.WriteLine($"{total} {maks}");
        }
    }
- id: cs-f4-eof
  type: write
  title: Sampai Gulungan Habis
  difficulty: 2
  prompt: Input berisi sejumlah bilangan bulat dipisah spasi atau baris baru (banyaknya tidak diketahui). Cetak banyaknya bilangan dan rata-ratanya (2 desimal), dipisah spasi.
  starter: |
    using System;

    class Program
    {
        static void Main()
        {
            // tulis kodemu di sini
        }
    }
  tests:
  - 1 2 3 4
  - '10'
  - |-
    5
    6
    7
  hints: |
    Baca seluruh input lalu pecah berdasarkan spasi/baris.
    Hitung banyak dan jumlahnya.
    Rata-rata = jumlah / banyak, dalam desimal.
  solution: |
    using System;
    using System.Linq;

    class Program
    {
        static void Main()
        {
            var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
            var xs = t.Select(long.Parse).ToList();
            Console.WriteLine($"{xs.Count} {(double)xs.Sum() / xs.Count:F2}");
        }
    }
- id: cs-f4-bug
  type: bughunt
  title: Spasi yang Menyusup
  difficulty: 2
  prompt: Program membaca seluruh input lalu mencetak angkanya dikali 2. Pembuatnya mengira input SELALU diakhiri satu newline, jadi ia memotong karakter terakhir. Akibatnya input tanpa newline di akhir
    salah dibaca. Temukan baris yang salah.
  starter: |
    using System;

    class Program
    {
        static void Main()
        {
            string baris = Console.In.ReadToEnd();
            int n = int.Parse(baris.Substring(0, baris.Length - 1));
            Console.WriteLine(n * 2);
        }
    }
  bug_line: 8
  tests:
  - '21'
  - |
    0
  - '-7'
  hints: |
    Baris yang dibaca masih berisi "\n" di ujungnya.
    Teks "21\n" tidak bisa diubah langsung menjadi angka.
    Buang spasi/newline di ujung sebelum mengubah ke angka.
  solution: |
    using System;

    class Program
    {
        static void Main()
        {
            string baris = Console.In.ReadToEnd();
            int n = int.Parse(baris.Trim());
            Console.WriteLine(n * 2);
        }
    }
