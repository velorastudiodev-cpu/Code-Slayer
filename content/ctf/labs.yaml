# ================= REVERSE ENGINEERING =================
- id: rev-balik
  title: Kunci Terbalik
  cat: rev
  points: 50
  kind: crackme
  chapter: l1
  story: Program pemeriksa kunci ini terlalu jujur.
  task: Baca kodenya dan temukan kunci yang diterima. Flag = SLAYER{kunci}.
  hints:
    - "Ikuti apa yang dilakukan pada input."
    - "split-reverse-join membalik string."
    - "Balik string pembandingnya."
  config:
    code: |
      function periksa(kunci) {
        const dibalik = kunci.split('').reverse().join('')
        return dibalik === 'arihsah_idajnem'
      }
  flag: SLAYER{menjadi_hashira}
  solution: menjadi_hashira
  writeup: Pemeriksaan di sisi klien selalu bisa dibaca. Logika rahasia harus di server.
- id: rev-xor
  title: Gembok Bitwise
  cat: rev
  points: 150
  kind: crackme
  chapter: l1
  story: Setiap huruf kunci di-XOR dengan 7 lalu dibandingkan dengan deret angka.
  task: Hitung kunci yang benar. Flag = SLAYER{kunci}.
  hints:
    - "XOR bisa dibalik dengan XOR yang sama."
    - "Untuk setiap angka n, huruf = String.fromCharCode(n ^ 7)."
    - "Hasilnya nama lengkap tokoh utama (huruf kecil, pakai _)."
  config:
    code: |
      function periksa(kunci) {
        const target = [108, 102, 106, 102, 99, 104, 88, 115, 102, 105, 109, 110, 117, 104]
        if (kunci.length !== target.length) return false
        for (let i = 0; i < kunci.length; i++) if ((kunci.charCodeAt(i) ^ 7) !== target[i]) return false
        return true
      }
  flag: SLAYER{kamado_tanjiro}
  solution: kamado_tanjiro
  writeup: Operasi yang bisa dibalik (XOR, penjumlahan) tidak menyembunyikan apa pun.
- id: rev-asm
  title: Gulungan Assembly
  cat: rev
  points: 200
  kind: crackme
  chapter: l1
  story: Fungsi berikut diterjemahkan dari assembly x86 sederhana. Kunci adalah angka yang membuat eax akhir = 0.
  task: Hitung angka kuncinya. Flag = SLAYER{angka}.
  hints:
    - "Ikuti register: eax = kunci; eax *= 3; eax += 7; eax ^= 0x55."
    - "Agar hasil akhir 0 maka eax sebelum XOR = 0x55 = 85."
    - "3k + 7 = 85, jadi k = 26"
  config:
    code: |
      // mov eax, [kunci] ; imul eax, 3 ; add eax, 7 ; xor eax, 0x55 ; test eax, eax ; sete al
      function periksa(kunci) {
        let eax = Number(kunci)
        eax = eax * 3
        eax = eax + 7
        eax = eax ^ 0x55
        return Number.isInteger(Number(kunci)) && eax === 0
      }
  flag: SLAYER{26}
  solution: '26'
  writeup: Membaca assembly = menelusuri register langkah demi langkah, lalu membalik persamaannya.

