- id: cr-vigenere
  title: Kunci Pernapasan
  cat: crypto
  points: 150
  kind: crypto
  chapter: m6
  story: Pesan disandi Vigenère. Kuncinya nama gaya pernapasan Tanjiro (huruf kecil, tanpa spasi).
  task: Dekripsi dengan Vigenère.
  hints:
    - "Tanjiro memakai Napas Air (dan Hinokami Kagura)."
    - "Kunci dalam bahasa Indonesia."
    - "kunci = air"
