lesson:
- text: 'if di Go tidak memakai kurung di sekitar kondisi, tapi kurung kurawal wajib. if boleh punya pernyataan pendek sebelum kondisi: if x := f(); x > 0 { ... }.'
  code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnilai := 78\n\tif nilai >= 85 {\n\t\tfmt.Println(\"A\")\n\t} else if nilai >= 70 {\n\t\tfmt.Println(\"B\")\n\t} else {\n\t\tfmt.Println(\"C\"\
    )\n\t}\n}\n"
- text: switch di Go otomatis berhenti di case yang cocok (tidak perlu break). Satu case boleh berisi beberapa nilai, dan switch tanpa ekspresi berfungsi seperti rantai if.
  code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnapas := \"petir\"\n\tswitch napas {\n\tcase \"air\", \"bunga\":\n\t\tfmt.Println(\"lembut\")\n\tcase \"petir\":\n\t\tfmt.Println(\"cepat\")\n\
    \tdefault:\n\t\tfmt.Println(\"?\")\n\t}\n}\n"
exercises:
- id: go-f5-nilai
  type: write
  title: Rapor Kisatsutai
  difficulty: 1
  prompt: Baca nilai (0-100). Cetak A jika ≥ 85, B jika ≥ 70, C jika ≥ 55, selain itu D.
  starter: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\t// tulis kodemu di sini\n\tfmt.Println()\n}\n"
  tests:
  - '90'
  - '85'
  - '70'
  - '69'
  - '55'
  - '10'
  hints: |
    Periksa dari syarat tertinggi.
    Rantai if / else if / else.
    Cetak satu huruf saja.
  solution: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar n int\n\tfmt.Scan(&n)\n\tif n >= 85 {\n\t\tfmt.Println(\"A\")\n\t} else if n >= 70 {\n\t\tfmt.Println(\"B\")\n\t} else if n >= 55 {\n\t\
    \tfmt.Println(\"C\")\n\t} else {\n\t\tfmt.Println(\"D\")\n\t}\n}\n"
- id: go-f5-kabisat
  type: write
  title: Tahun Kabisat
  difficulty: 2
  prompt: Baca tahun. Cetak "kabisat" jika habis dibagi 400, atau habis dibagi 4 tapi tidak habis dibagi 100. Selain itu "bukan".
  starter: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\t// tulis kodemu di sini\n\tfmt.Println()\n}\n"
  tests:
  - '2024'
  - '1900'
  - '2000'
  - '2023'
  hints: |
    Habis dibagi berarti % ... == 0.
    Gabungkan dengan || dan &&.
    (t % 400 == 0) || (t % 4 == 0 && t % 100 != 0)
  solution: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar t int\n\tfmt.Scan(&t)\n\tif t%400 == 0 || (t%4 == 0 && t%100 != 0) {\n\t\tfmt.Println(\"kabisat\")\n\t} else {\n\t\tfmt.Println(\"bukan\"\
    )\n\t}\n}\n"
- id: go-f5-predict
  type: predict
  title: Cabang Mana yang Dipilih?
  difficulty: 2
  prompt: Tulis output persis dari program berikut.
  code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor _, x := range []int{0, 3, 8, 15} {\n\t\tswitch {\n\t\tcase x == 0:\n\t\t\tfmt.Print(\"nol \")\n\t\tcase x%2 == 1 && x > 10:\n\t\t\tfmt.Print(\"\
    besar-ganjil \")\n\t\tcase x%2 == 1:\n\t\t\tfmt.Print(\"ganjil \")\n\t\tdefault:\n\t\t\tfmt.Print(\"genap \")\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
  hints: |
    Telusuri nilai variabel baris demi baris.
    Hanya satu cabang yang dijalankan per pemeriksaan.
    Perhatikan kasus default/else.
  solution: x
- id: go-f5-parsons
  type: parsons
  title: Tanda Bilangan
  difficulty: 1
  prompt: Susun program yang mencetak "positif", "negatif", atau "nol".
  tests:
  - '5'
  - '-3'
  - '0'
  hints: |
    Deklarasi fungsi utama paling atas.
    Baca n sebelum memeriksanya.
    Kurung tutup paling akhir.
  solution: "package main\nimport \"fmt\"\nfunc main() {\n\tvar n int\n\tfmt.Scan(&n)\n\tif n > 0 {\n\t\tfmt.Println(\"positif\")\n\t} else if n < 0 {\n\t\tfmt.Println(\"negatif\")\n\t} else {\n\t\tfmt.Println(\"\
    nol\")\n\t}\n}\n"
