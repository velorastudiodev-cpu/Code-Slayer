lesson:
- text: fmt.Scan membaca nilai dipisah spasi atau baris baru ke dalam variabel (pakai &). Ia mengembalikan banyak nilai yang berhasil dibaca dan error, berguna untuk membaca sampai input habis.
  code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar a, b int\n\tfmt.Scan(&a, &b)\n\tfmt.Println(\"jumlah:\", a+b)\n}\n"
- text: Untuk membaca per baris, pakai bufio.Reader atau bufio.Scanner. Baris yang dibaca ReadString masih membawa \n, jadi bersihkan dengan strings.TrimSpace sebelum diubah dengan strconv.Atoi.
  code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n\t\"strings\"\n)\n\nfunc main() {\n\tr := bufio.NewReader(os.Stdin)\n\tbaris, _ := r.ReadString('\\n')\n\tfmt.Printf(\"[%s]\\n\", strings.TrimSpace(baris))\n\
    }\n"
exercises:
- id: go-f4-jumlah
  type: write
  title: Menjumlah Dua Bilah
  difficulty: 1
  prompt: Baca dua bilangan bulat (dalam satu baris), cetak jumlahnya.
  starter: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\t// tulis kodemu di sini\n\tfmt.Println()\n}\n"
  tests:
  - 3 4
  - 10 -2
  - 0 0
  hints: |
    Baca dua bilangan dari input.
    Ubah teks menjadi angka.
    Cetak a + b.
  solution: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar a, b int\n\tfmt.Scan(&a, &b)\n\tfmt.Println(a + b)\n}\n"
- id: go-f4-n
  type: write
  title: Laporan Berjumlah n
  difficulty: 2
  prompt: Baris pertama berisi n, baris kedua berisi n bilangan. Cetak jumlah dan nilai terbesarnya, dipisah spasi.
  starter: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\t// tulis kodemu di sini\n\tfmt.Println()\n}\n"
  tests:
  - |-
    3
    1 9 2
  - |-
    1
    -5
  - |-
    5
    -1 -2 -3 -4 -5
  hints: |
    Nilai terbesar awal = bilangan pertama, bukan 0.
    Ingat bilangan bisa negatif semua.
    Cetak "<jumlah> <maks>".
  solution: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar n int\n\tfmt.Scan(&n)\n\ttotal, maks := 0, 0\n\tfor i := 0; i < n; i++ {\n\t\tvar x int\n\t\tfmt.Scan(&x)\n\t\ttotal += x\n\t\tif i ==\
    \ 0 || x > maks {\n\t\t\tmaks = x\n\t\t}\n\t}\n\tfmt.Println(total, maks)\n}\n"
- id: go-f4-eof
  type: write
  title: Sampai Gulungan Habis
  difficulty: 2
  prompt: Input berisi sejumlah bilangan bulat dipisah spasi atau baris baru (banyaknya tidak diketahui). Cetak banyaknya bilangan dan rata-ratanya (2 desimal), dipisah spasi.
  starter: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\t// tulis kodemu di sini\n\tfmt.Println()\n}\n"
  tests:
  - 1 2 3 4
  - '10'
  - |-
    5
    6
    7
  hints: |
    Baca seluruh input lalu pecah berdasarkan spasi/baris.
    Hitung banyak dan jumlahnya.
    Rata-rata = jumlah / banyak, dalam desimal.
  solution: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tn, total := 0, 0\n\tfor {\n\t\tvar x int\n\t\tif _, err := fmt.Scan(&x); err != nil {\n\t\t\tbreak\n\t\t}\n\t\tn++\n\t\ttotal += x\n\t}\n\t\
    fmt.Printf(\"%d %.2f\\n\", n, float64(total)/float64(n))\n}\n"
- id: go-f4-bug
  type: bughunt
  title: Spasi yang Menyusup
  difficulty: 2
  prompt: Program membaca satu baris berisi angka lalu mencetak angka itu dikali 2, tapi gagal karena baris input masih membawa karakter newline. Temukan baris yang salah.
  starter: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n\t\"strconv\"\n\t\"strings\"\n)\n\nfunc main() {\n\tr := bufio.NewReader(os.Stdin)\n\tbaris, _ := r.ReadString('\\n')\n\tn, err :=\
    \ strconv.Atoi(baris)\n\tif err != nil {\n\t\tfmt.Println(\"gagal:\", err)\n\t\tos.Exit(1)\n\t}\n\t_ = strings.TrimSpace\n\tfmt.Println(n * 2)\n}\n"
  bug_line: 14
  tests:
  - |
    21
  - |
    0
  - |
    -7
  hints: |
    Baris yang dibaca masih berisi "\n" di ujungnya.
    Teks "21\n" tidak bisa diubah langsung menjadi angka.
    Buang spasi/newline di ujung sebelum mengubah ke angka.
  solution: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n\t\"strconv\"\n\t\"strings\"\n)\n\nfunc main() {\n\tr := bufio.NewReader(os.Stdin)\n\tbaris, _ := r.ReadString('\\n')\n\tn, err :=\
    \ strconv.Atoi(strings.TrimSpace(baris))\n\tif err != nil {\n\t\tfmt.Println(\"gagal:\", err)\n\t\tos.Exit(1)\n\t}\n\t_ = strings.TrimSpace\n\tfmt.Println(n * 2)\n}\n"
