# Soal orisinal setara Pelatnas TOKI: Fenwick, segment tree, DP bitmask, DP pohon, KMP, hashing, geometri, LCA.
- id: ol-t-fenwick
  title: Kas Desa Berjalan
  stage: pelatnas
  topics: [fenwick-tree]
  tl: 1000
  statement: |
    Kas N rumah awalnya A_1 … A_N. Ada Q operasi:
    "1 i x": kas rumah i ditambah x (x bisa negatif).
    "2 l r": berapa total kas rumah l sampai r?
    Cetak jumlah semua jawaban operasi tipe 2.
  input: |
    Baris pertama N dan Q. Baris kedua A_1 … A_N. Q baris berikutnya berisi operasi.
  output: |
    Jumlah semua jawaban tipe 2.
  constraints: |
    1 ≤ N, Q ≤ 200.000, |A_i|, |x| ≤ 10^9
  samples: ["5 4\n1 2 3 4 5\n2 1 5\n1 3 10\n2 2 4\n2 3 3\n"]
  subtasks:
    - points: 30
      desc: "N, Q ≤ 3000"
      tests: [{gen: "const n=3000,q=3000;const L=[];for(let i=0;i<q;i++){if(R.int(0,1)){L.push('1 '+R.int(1,n)+' '+R.int(-1e9,1e9))}else{const l=R.int(1,n);L.push('2 '+l+' '+R.int(l,n))}}return n+' '+q+'\\n'+R.arr(n,-1e9,1e9).join(' ')+'\\n'+L.join('\\n')", seed: 301}]
    - points: 70
      desc: Tanpa batasan tambahan
      tests: [{gen: "const n=200000,q=200000;const L=[];for(let i=0;i<q;i++){if(R.int(0,1)){L.push('1 '+R.int(1,n)+' '+R.int(-1e9,1e9))}else{L.push('2 1 '+n)}}return n+' '+q+'\\n'+R.arr(n,-1e9,1e9).join(' ')+'\\n'+L.join('\\n')", seed: 302}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int n; vector<long long> bit;
    void tambah(int i, long long x) { for (; i <= n; i += i & -i) bit[i] += x; }
    long long jumlah(int i) { long long s = 0; for (; i > 0; i -= i & -i) s += bit[i]; return s; }
    int main() {
        int q; scanf("%d %d", &n, &q); bit.assign(n + 1, 0);
        for (int i = 1; i <= n; i++) { long long a; scanf("%lld", &a); tambah(i, a); }
        __int128 total = 0;
        while (q--) { int t; long long a, b; scanf("%d %lld %lld", &t, &a, &b); if (t == 1) tambah(a, b); else total += jumlah(b) - jumlah(a - 1); }
        bool neg = total < 0; if (neg) total = -total;
        string s; do { s += char('0' + (int)(total % 10)); total /= 10; } while (total > 0);
        if (neg) s += '-'; reverse(s.begin(), s.end()); printf("%s\n", s.c_str());
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          int n, q; scanf("%d %d", &n, &q); vector<long long> a(n + 1);
          for (int i = 1; i <= n; i++) scanf("%lld", &a[i]);
          __int128 total = 0;
          while (q--) { int t; long long x, y; scanf("%d %lld %lld", &t, &x, &y); if (t == 1) a[x] += y; else for (long long i = x; i <= y; i++) total += a[i]; }
          bool neg = total < 0; if (neg) total = -total;
          string s; do { s += char('0' + (int)(total % 10)); total /= 10; } while (total > 0);
          if (neg) s += '-'; reverse(s.begin(), s.end()); printf("%s\n", s.c_str());
      }
  editorial:
    hint: Prefix sum biasa rusak setiap kali ada perubahan. Perlu struktur yang mendukung ubah DAN jumlah dengan cepat.
    idea: Fenwick tree (Binary Indexed Tree) menyimpan jumlah blok berukuran pangkat dua; update dan query prefix masing-masing O(log N).
    solution: Tipe 1 → tambah(i, x); tipe 2 → jumlah(r) − jumlah(l−1). Total jawaban bisa melebihi long long, pakai __int128.
    complexity: O((N + Q) log N)

- id: ol-t-segtree
  title: Penjaga Terlemah
  stage: pelatnas
  topics: [segment-tree]
  tl: 1000
  statement: |
    N penjaga berbaris dengan kekuatan A_i. Ada Q operasi:
    "1 i x": kekuatan penjaga i menjadi x.
    "2 l r": berapa kekuatan TERKECIL di antara penjaga l sampai r?
    Cetak jumlah semua jawaban tipe 2.
  input: |
    Baris pertama N dan Q. Baris kedua A_1 … A_N. Q baris berikutnya berisi operasi.
  output: |
    Jumlah semua jawaban tipe 2.
  constraints: |
    1 ≤ N, Q ≤ 200.000, 0 ≤ A_i, x ≤ 10^9
  samples: ["5 4\n5 3 8 1 4\n2 1 3\n2 1 5\n1 4 9\n2 3 5\n"]
  subtasks:
    - points: 30
      desc: "N, Q ≤ 3000"
      tests: [{gen: "const n=3000,q=3000;const L=[];for(let i=0;i<q;i++){if(R.int(0,1)){L.push('1 '+R.int(1,n)+' '+R.int(0,1e9))}else{const l=R.int(1,n);L.push('2 '+l+' '+R.int(l,n))}}return n+' '+q+'\\n'+R.arr(n,0,1e9).join(' ')+'\\n'+L.join('\\n')", seed: 311}]
    - points: 70
      desc: Tanpa batasan tambahan
      tests: [{gen: "const n=200000,q=200000;const L=[];for(let i=0;i<q;i++){if(i%2){L.push('1 '+R.int(1,n)+' '+R.int(0,1e9))}else{L.push('2 '+R.int(1,10)+' '+R.int(n-10,n))}}return n+' '+q+'\\n'+R.arr(n,0,1e9).join(' ')+'\\n'+L.join('\\n')", seed: 312}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int sz; vector<long long> t;
    void ubah(int i, long long x) { for (t[i += sz] = x; i > 1; i >>= 1) t[i >> 1] = min(t[i], t[i ^ 1]); }
    long long minimum(int l, int r) { long long m = LLONG_MAX; for (l += sz, r += sz + 1; l < r; l >>= 1, r >>= 1) { if (l & 1) m = min(m, t[l++]); if (r & 1) m = min(m, t[--r]); } return m; }
    int main() {
        int n, q; scanf("%d %d", &n, &q);
        sz = 1; while (sz < n) sz <<= 1; t.assign(2 * sz, LLONG_MAX);
        for (int i = 0; i < n; i++) scanf("%lld", &t[sz + i]);
        for (int i = sz - 1; i > 0; i--) t[i] = min(t[2 * i], t[2 * i + 1]);
        long long total = 0;
        while (q--) { int k; long long a, b; scanf("%d %lld %lld", &k, &a, &b); if (k == 1) ubah(a - 1, b); else total += minimum(a - 1, b - 1); }
        printf("%lld\n", total);
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          int n, q; scanf("%d %d", &n, &q); vector<long long> a(n + 1);
          for (int i = 1; i <= n; i++) scanf("%lld", &a[i]);
          long long total = 0;
          while (q--) { int k; long long x, y; scanf("%d %lld %lld", &k, &x, &y); if (k == 1) a[x] = y; else total += *min_element(a.begin() + x, a.begin() + y + 1); }
          printf("%lld\n", total);
      }
  editorial:
    hint: Minimum tidak bisa "dikurangkan" seperti jumlah, jadi trik prefix tidak berlaku.
    idea: Segment tree menyimpan minimum setiap segmen; rentang apa pun bisa disusun dari O(log N) segmen.
    solution: Segment tree iteratif (bottom-up) — ubah titik lalu perbarui leluhurnya; query menggabungkan segmen dari kedua ujung.
    complexity: O((N + Q) log N)

- id: ol-t-inversi
  title: Kekacauan Barisan
  stage: pelatnas
  topics: [fenwick-tree, sorting]
  tl: 1000
  statement: |
    Tingkat kekacauan barisan slayer A_1 … A_N adalah banyak pasangan (i, j) dengan i < j dan A_i > A_j (inversi). Hitung kekacauannya.
  input: |
    Baris pertama N. Baris kedua A_1 … A_N.
  output: |
    Banyak inversi.
  constraints: |
    1 ≤ N ≤ 200.000, 1 ≤ A_i ≤ 10^9
  samples: ["5\n2 4 1 3 5\n"]
  subtasks:
    - points: 30
      desc: "N ≤ 3000"
      tests: [{gen: "const n=3000;return n+'\\n'+R.arr(n,1,1e9).join(' ')", seed: 321}, {gen: "const n=3000;return n+'\\n'+R.arr(n,1,3).join(' ')", seed: 322}]
    - points: 70
      desc: "N ≤ 200.000"
      tests: [{gen: "const n=200000;return n+'\\n'+R.arr(n,1,1e9).join(' ')", seed: 323}, {gen: "const n=200000;return n+'\\n'+Array.from({length:n},(_, i)=>n-i).join(' ')", seed: 324}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        int n; scanf("%d", &n); vector<int> a(n); for (auto &x : a) scanf("%d", &x);
        vector<int> v = a; sort(v.begin(), v.end()); v.erase(unique(v.begin(), v.end()), v.end());
        int m = v.size(); vector<int> bit(m + 1, 0);
        long long inv = 0;
        for (int i = n - 1; i >= 0; i--) { // hitung yang lebih kecil di sebelah kanan
            int k = lower_bound(v.begin(), v.end(), a[i]) - v.begin(); // 0-based → elemen < a[i] ada di indeks ≤ k
            for (int j = k; j > 0; j -= j & -j) inv += bit[j];
            for (int j = k + 1; j <= m; j += j & -j) bit[j]++;
        }
        printf("%lld\n", inv);
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      int main() { int n; scanf("%d", &n); std::vector<int> a(n); for (auto &x : a) scanf("%d", &x); long long c = 0; for (int i = 0; i < n; i++) for (int j = i + 1; j < n; j++) c += a[i] > a[j]; printf("%lld\n", c); }
  editorial:
    hint: Dari kanan ke kiri, inversi yang dibuat A_i = banyak elemen di kanannya yang lebih kecil.
    idea: 'Kompres nilai ke 1..M, lalu Fenwick tree menghitung "berapa nilai < A_i yang sudah dilihat" dalam O(log N). (Alternatif: merge sort.)'
    solution: Iterasi dari kanan; tambahkan prefix(k) ke jawaban, lalu masukkan A_i ke Fenwick.
    complexity: O(N log N)

- id: ol-t-tsp
  title: Patroli Semua Desa
  stage: pelatnas
  topics: [dp-bitmask]
  tl: 1000
  statement: |
    Ada N desa; waktu tempuh dari desa i ke desa j adalah D[i][j]. Mulai dari desa 1, kunjungi setiap desa tepat sekali lalu kembali ke desa 1.
    Berapa total waktu minimum?
  input: |
    Baris pertama N. N baris berikutnya berisi matriks D (D[i][i] = 0).
  output: |
    Total waktu minimum.
  constraints: |
    2 ≤ N ≤ 16, 1 ≤ D[i][j] ≤ 10^6 untuk i ≠ j
  samples: ["4\n0 10 15 20\n10 0 35 25\n15 35 0 30\n20 25 30 0\n"]
  subtasks:
    - points: 30
      desc: "N ≤ 8"
      tests: [{gen: "const n=8;let s=n+'\\n';for(let i=0;i<n;i++){const r=[];for(let j=0;j<n;j++)r.push(i==j?0:R.int(1,1e6));s+=r.join(' ')+'\\n'}return s", seed: 331}, "2\n0 5\n7 0\n"]
    - points: 70
      desc: "N ≤ 16"
      tests: [{gen: "const n=16;let s=n+'\\n';for(let i=0;i<n;i++){const r=[];for(let j=0;j<n;j++)r.push(i==j?0:R.int(1,1e6));s+=r.join(' ')+'\\n'}return s", seed: 332}, {gen: "const n=15;let s=n+'\\n';for(let i=0;i<n;i++){const r=[];for(let j=0;j<n;j++)r.push(i==j?0:R.int(1,100));s+=r.join(' ')+'\\n'}return s", seed: 333}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        int n; scanf("%d", &n); vector<vector<long long>> d(n, vector<long long>(n));
        for (auto &r : d) for (auto &x : r) scanf("%lld", &x);
        const long long INF = LLONG_MAX / 4;
        vector<vector<long long>> dp(1 << n, vector<long long>(n, INF)); // dp[himpunan][posisi terakhir]
        dp[1][0] = 0;
        for (int m = 1; m < (1 << n); m++) for (int u = 0; u < n; u++) if (dp[m][u] < INF)
            for (int v = 0; v < n; v++) if (!(m >> v & 1)) dp[m | 1 << v][v] = min(dp[m | 1 << v][v], dp[m][u] + d[u][v]);
        long long best = INF; for (int u = 1; u < n; u++) best = min(best, dp[(1 << n) - 1][u] + d[u][0]);
        printf("%lld\n", best);
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          int n; scanf("%d", &n); vector<vector<long long>> d(n, vector<long long>(n));
          for (auto &r : d) for (auto &x : r) scanf("%lld", &x);
          vector<int> p(n - 1); iota(p.begin(), p.end(), 1); long long best = LLONG_MAX;
          do { long long s = d[0][p[0]]; for (int i = 0; i + 1 < n - 1; i++) s += d[p[i]][p[i + 1]]; s += d[p.back()][0]; best = min(best, s); } while (next_permutation(p.begin(), p.end()));
          printf("%lld\n", best);
      }
  editorial:
    hint: Mencoba semua urutan butuh (N−1)! langkah; 15! ≈ 1,3·10^12. Apa yang sebenarnya penting dari perjalanan yang sudah dilalui?
    idea: Yang penting hanya HIMPUNAN desa yang sudah dikunjungi dan desa terakhir, bukan urutannya. Simpan himpunan sebagai bitmask.
    solution: dp[mask][u] = waktu minimum mengunjungi mask dan berakhir di u; transisi ke v di luar mask. Jawaban = min dp[semua][u] + D[u][1].
    complexity: O(2^N · N²)

- id: ol-t-pohon
  title: Penjaga Pohon Wisteria
  stage: pelatnas
  topics: [dp-pohon]
  tl: 1000
  statement: |
    Desa berbentuk pohon dengan N rumah (N−1 jalan). Menempatkan penjaga di rumah i memberi nilai W_i, tetapi dua rumah yang
    terhubung langsung tidak boleh sama-sama dijaga. Berapa total nilai maksimum?
  input: |
    Baris pertama N. Baris kedua W_1 … W_N. N−1 baris berikutnya berisi U dan V (jalan).
  output: |
    Total nilai maksimum.
  constraints: |
    1 ≤ N ≤ 200.000, 1 ≤ W_i ≤ 10^9
  samples: ["5\n3 2 1 10 1\n1 2\n1 3\n2 4\n2 5\n"]
  subtasks:
    - points: 25
      desc: "N ≤ 18"
      tests: [{gen: "const n=18;let s=n+'\\n'+R.arr(n,1,1e9).join(' ')+'\\n';for(let i=2;i<=n;i++)s+=R.int(1,i-1)+' '+i+'\\n';return s", seed: 341}, "1\n7\n"]
    - points: 75
      desc: "N ≤ 200.000"
      tests: [{gen: "const n=200000;const L=[];for(let i=2;i<=n;i++)L.push(R.int(1,i-1)+' '+i);return n+'\\n'+R.arr(n,1,1e9).join(' ')+'\\n'+L.join('\\n')", seed: 342}, {gen: "const n=200000;const L=[];for(let i=2;i<=n;i++)L.push((i-1)+' '+i);return n+'\\n'+R.arr(n,1,1e9).join(' ')+'\\n'+L.join('\\n')", seed: 343}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        int n; scanf("%d", &n); vector<long long> w(n + 1); for (int i = 1; i <= n; i++) scanf("%lld", &w[i]);
        vector<vector<int>> adj(n + 1);
        for (int i = 0; i < n - 1; i++) { int u, v; scanf("%d %d", &u, &v); adj[u].push_back(v); adj[v].push_back(u); }
        // urutan DFS iteratif (pohon bisa berupa rantai sepanjang 200.000 → rekursi berisiko stack overflow)
        vector<int> urut, par(n + 1, 0), st = {1}; par[1] = -1;
        while (!st.empty()) { int u = st.back(); st.pop_back(); urut.push_back(u); for (int v : adj[u]) if (v != par[u]) { par[v] = u; st.push_back(v); } }
        vector<long long> ambil(n + 1), lewat(n + 1);
        for (int i = n - 1; i >= 0; i--) {
            int u = urut[i]; ambil[u] += w[u];
            if (par[u] > 0) { ambil[par[u]] += lewat[u]; lewat[par[u]] += max(ambil[u], lewat[u]); }
        }
        printf("%lld\n", max(ambil[1], lewat[1]));
    }
  naive:
    score: 25
    code: |
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          int n; scanf("%d", &n); vector<long long> w(n); for (auto &x : w) scanf("%lld", &x);
          vector<pair<int,int>> e(n - 1); for (auto &x : e) { scanf("%d %d", &x.first, &x.second); x.first--; x.second--; }
          long long best = 0;
          for (long long m = 0; m < (1LL << min(n, 40)); m++) {
              bool ok = true; for (auto [u, v] : e) if ((m >> u & 1) && (m >> v & 1)) { ok = false; break; }
              if (!ok) continue; long long s = 0; for (int i = 0; i < n; i++) if (m >> i & 1) s += w[i]; best = max(best, s);
          }
          printf("%lld\n", best);
      }
  editorial:
    hint: Untuk setiap rumah cukup tahu dua hal tentang subpohonnya — nilai terbaik bila rumah ini dijaga, dan bila tidak.
    idea: "DP pohon: ambil[u] = W_u + Σ lewat[anak]; lewat[u] = Σ max(ambil[anak], lewat[anak])."
    solution: Proses simpul dari daun ke akar (urutan DFS terbalik, iteratif agar aman untuk rantai panjang).
    complexity: O(N)

- id: ol-t-kmp
  title: Mencari Jurus di Gulungan
  stage: pelatnas
  topics: [string, kmp]
  tl: 1000
  statement: |
    Gulungan teks T dan nama jurus P. Berapa kali P muncul di T (kemunculan boleh tumpang tindih)?
  input: |
    Baris pertama T, baris kedua P (huruf kecil).
  output: |
    Banyak kemunculan.
  constraints: |
    1 ≤ |P| ≤ |T| ≤ 10^6
  samples: ["abababa\naba\n"]
  subtasks:
    - points: 30
      desc: "|T| ≤ 5000"
      tests: [{gen: "return R.str(5000,'ab')+'\\n'+R.str(3,'ab')", seed: 351}, "a\na\n"]
    - points: 70
      desc: "|T| ≤ 10^6"
      tests: [{gen: "return 'a'.repeat(1000000)+'\\n'+'a'.repeat(5000)", seed: 352}, {gen: "return 'a'.repeat(1000000)+'\\n'+'a'.repeat(499999)+'b'", seed: 353}, {gen: "return R.str(1000000,'ab')+'\\n'+R.str(10,'ab')", seed: 354}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        static char t[1000005], p[1000005]; scanf("%s %s", t, p);
        int n = strlen(t), m = strlen(p);
        vector<int> f(m, 0); // f[i] = panjang prefix terpanjang dari P yang juga suffix dari P[0..i]
        for (int i = 1, k = 0; i < m; i++) { while (k && p[i] != p[k]) k = f[k - 1]; if (p[i] == p[k]) k++; f[i] = k; }
        long long c = 0;
        for (int i = 0, k = 0; i < n; i++) { while (k && t[i] != p[k]) k = f[k - 1]; if (t[i] == p[k]) k++; if (k == m) { c++; k = f[k - 1]; } }
        printf("%lld\n", c);
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      int main() { static char t[1000005], p[1000005]; scanf("%s %s", t, p); int n = strlen(t), m = strlen(p); long long c = 0; for (int i = 0; i + m <= n; i++) { int j = 0; while (j < m && t[i + j] == p[j]) j++; c += j == m; } printf("%lld\n", c); }
  editorial:
    hint: Pencocokan polos bisa mengulang hampir |P| perbandingan di setiap posisi (coba T = aaaa…a, P = aa…ab).
    idea: KMP — fungsi kegagalan f memberi tahu seberapa panjang kecocokan yang masih bisa dipertahankan setelah gagal, jadi pointer teks tidak pernah mundur.
    solution: Bangun f untuk P, lalu telusuri T sekali; setiap kali k = |P|, catat kemunculan dan lanjut dari f[k−1].
    complexity: O(|T| + |P|)

- id: ol-t-hash
  title: Mantra Berbeda
  stage: pelatnas
  topics: [string, hashing]
  tl: 1500
  statement: |
    Diberikan string S dan bilangan L. Berapa banyak substring BERBEDA dari S yang panjangnya tepat L?
  input: |
    Baris pertama S (huruf kecil). Baris kedua L.
  output: |
    Banyak substring berbeda sepanjang L.
  constraints: |
    1 ≤ L ≤ |S| ≤ 200.000
  samples: ["abcabc\n3\n"]
  subtasks:
    - points: 30
      desc: "|S| ≤ 2000"
      tests: [{gen: "return R.str(2000,'ab')+'\\n'+R.int(1,30)", seed: 361}, "a\n1\n"]
    - points: 70
      desc: "|S| ≤ 200.000"
      tests: [{gen: "return R.str(200000)+'\\n100000'", seed: 362}, {gen: "return R.str(200000,'ab')+'\\n20'", seed: 363}, {gen: "return 'ab'.repeat(100000)+'\\n50000'", seed: 364}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    typedef unsigned long long u64;
    int main() {
        static char s[200005]; int L; scanf("%s %d", s, &L); int n = strlen(s);
        // hash ganda: modulo 2^61−1 dengan dua basis berbeda (peluang tabrakan sangat kecil)
        const u64 MOD = (1ULL << 61) - 1;
        auto mul = [&](u64 a, u64 b) { __uint128_t c = (__uint128_t)a * b; u64 r = (u64)(c & MOD) + (u64)(c >> 61); return r >= MOD ? r - MOD : r; };
        auto hashes = [&](u64 B) {
            u64 pw = 1; for (int i = 0; i < L; i++) pw = mul(pw, B);
            vector<u64> h; u64 cur = 0;
            for (int i = 0; i < n; i++) {
                cur = mul(cur, B) + (u64)s[i]; if (cur >= MOD) cur -= MOD;
                if (i >= L) { u64 sub = mul(pw, (u64)s[i - L]); cur = cur >= sub ? cur - sub : cur + MOD - sub; }
                if (i >= L - 1) h.push_back(cur);
            }
            return h;
        };
        auto h1 = hashes(911382323), h2 = hashes(972663749);
        vector<pair<u64,u64>> all(h1.size()); for (size_t i = 0; i < h1.size(); i++) all[i] = {h1[i], h2[i]};
        sort(all.begin(), all.end());
        printf("%zu\n", (size_t)(unique(all.begin(), all.end()) - all.begin()));
    }
