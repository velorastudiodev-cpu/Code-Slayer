- id: ol-t-hull
  title: Pagar Wisteria
  stage: pelatnas
  topics: [geometri, convex-hull]
  tl: 1000
  statement: |
    Ada N pohon wisteria di titik (x_i, y_i). Pagar terpendek yang mengelilingi semua pohon berbentuk convex hull.
    Cetak dua kali luas daerah di dalam pagar (selalu bilangan bulat).
  input: |
    Baris pertama N. N baris berikutnya berisi x_i dan y_i.
  output: |
    Dua kali luas convex hull (0 bila semua titik segaris).
  constraints: |
    1 ≤ N ≤ 200.000, |x_i|, |y_i| ≤ 10^10
  samples: ["5\n0 0\n4 0\n4 4\n0 4\n2 2\n"]
  subtasks:
    - points: 30
      desc: "N ≤ 1000"
      tests: [{gen: "const n=1000;let s=n+'\\n';for(let i=0;i<n;i++)s+=R.int(-1e9,1e9)+' '+R.int(-1e9,1e9)+'\\n';return s", seed: 371}, "3\n0 0\n1 1\n2 2\n", "1\n5 5\n"]
    - points: 70
      desc: "N ≤ 200.000"
      tests: [{gen: "const n=200000;let s=n+'\\n';for(let i=0;i<n;i++){const x=i-100000;s+=x+' '+(x*x)+'\\n'}return s", seed: 372}, {gen: "const n=200000;let s=n+'\\n';for(let i=0;i<n;i++)s+=R.int(-1e9,1e9)+' '+R.int(-1e9,1e9)+'\\n';return s", seed: 373}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    typedef long long ll; typedef pair<ll,ll> P;
    __int128 cross(P o, P a, P b) { return (__int128)(a.first - o.first) * (b.second - o.second) - (__int128)(a.second - o.second) * (b.first - o.first); }
    int main() {
        int n; scanf("%d", &n); vector<P> p(n); for (auto &x : p) scanf("%lld %lld", &x.first, &x.second);
        sort(p.begin(), p.end()); p.erase(unique(p.begin(), p.end()), p.end()); n = p.size();
        if (n < 3) { puts("0"); return 0; }
        vector<P> h(2 * n); int k = 0; // monotone chain (Andrew)
        for (int i = 0; i < n; i++) { while (k >= 2 && cross(h[k - 2], h[k - 1], p[i]) <= 0) k--; h[k++] = p[i]; }
        for (int i = n - 2, t = k + 1; i >= 0; i--) { while (k >= t && cross(h[k - 2], h[k - 1], p[i]) <= 0) k--; h[k++] = p[i]; }
        h.resize(k - 1);
        __int128 a = 0; for (size_t i = 0; i < h.size(); i++) { auto [x1, y1] = h[i]; auto [x2, y2] = h[(i + 1) % h.size()]; a += (__int128)x1 * y2 - (__int128)x2 * y1; }
        if (a < 0) a = -a;
        string s; do { s += char('0' + (int)(a % 10)); a /= 10; } while (a > 0); reverse(s.begin(), s.end()); printf("%s\n", s.c_str());
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      using namespace std;
      typedef long long ll; typedef pair<ll,ll> P;
      __int128 cross(P o, P a, P b) { return (__int128)(a.first - o.first) * (b.second - o.second) - (__int128)(a.second - o.second) * (b.first - o.first); }
      int main() { // Jarvis march (gift wrapping): O(N·H)
          int n; scanf("%d", &n); vector<P> p(n); for (auto &x : p) scanf("%lld %lld", &x.first, &x.second);
          sort(p.begin(), p.end()); p.erase(unique(p.begin(), p.end()), p.end()); n = p.size();
          if (n < 3) { puts("0"); return 0; }
          vector<P> h; int cur = 0;
          do {
              h.push_back(p[cur]); int nxt = (cur + 1) % n;
              for (int i = 0; i < n; i++) { __int128 c = cross(p[cur], p[nxt], p[i]); if (c < 0 || (c == 0 && (__int128)(p[i].first - p[cur].first) * (p[i].first - p[cur].first) + (__int128)(p[i].second - p[cur].second) * (p[i].second - p[cur].second) > (__int128)(p[nxt].first - p[cur].first) * (p[nxt].first - p[cur].first) + (__int128)(p[nxt].second - p[cur].second) * (p[nxt].second - p[cur].second))) nxt = i; }
              cur = nxt;
          } while (cur != 0 && (int)h.size() <= n);
          __int128 a = 0; for (size_t i = 0; i < h.size(); i++) { auto [x1, y1] = h[i]; auto [x2, y2] = h[(i + 1) % h.size()]; a += (__int128)x1 * y2 - (__int128)x2 * y1; }
          if (a < 0) a = -a;
          string s; do { s += char('0' + (int)(a % 10)); a /= 10; } while (a > 0); reverse(s.begin(), s.end()); printf("%s\n", s.c_str());
      }
  editorial:
    hint: Gift wrapping cepat bila hull-nya kecil, tetapi bisa O(N²) bila semua titik ada di hull (misalnya titik pada parabola).
    idea: Monotone chain (Andrew) — urutkan titik, bangun hull bawah dan atas dengan stack, buang titik yang membuat belokan tidak ke kiri (cross ≤ 0).
    solution: Luas ×2 dengan rumus shoelace. Nilai cross product dan luas bisa melebihi long long, gunakan __int128.
    complexity: O(N log N)

- id: ol-t-lca
  title: Leluhur Bersama Klan
  stage: pelatnas
  topics: [pohon, lca, binary-lifting]
  tl: 1000
  statement: |
    Silsilah klan berbentuk pohon berakar di anggota 1, dengan N anggota. Ada Q pertanyaan (a, b): berapa banyak jalan (sisi) pada lintasan antara a dan b?
    Cetak jumlah semua jawaban.
  input: |
    Baris pertama N dan Q. Baris kedua berisi P_2 … P_N (orang tua anggota i). Q baris berikutnya berisi a dan b.
  output: |
    Jumlah jarak semua pertanyaan.
  constraints: |
    2 ≤ N ≤ 200.000, 1 ≤ Q ≤ 200.000, 1 ≤ P_i < i
  samples: ["5 3\n1 1 2 2\n4 5\n4 3\n1 1\n"]
  subtasks:
    - points: 30
      desc: "N, Q ≤ 3000"
      tests: [{gen: "const n=3000,q=3000;const P=[];for(let i=2;i<=n;i++)P.push(i-1);const L=[];for(let i=0;i<q;i++)L.push(R.int(1,n)+' '+R.int(1,n));return n+' '+q+'\\n'+P.join(' ')+'\\n'+L.join('\\n')", seed: 381}]
    - points: 70
      desc: Tanpa batasan tambahan
      tests: [{gen: "const n=200000,q=200000;const P=[];for(let i=2;i<=n;i++)P.push(i-1);const L=[];for(let i=0;i<q;i++)L.push(R.int(n-100,n)+' '+R.int(1,100));return n+' '+q+'\\n'+P.join(' ')+'\\n'+L.join('\\n')", seed: 382}, {gen: "const n=200000,q=200000;const P=[];for(let i=2;i<=n;i++)P.push(R.int(1,i-1));const L=[];for(let i=0;i<q;i++)L.push(R.int(1,n)+' '+R.int(1,n));return n+' '+q+'\\n'+P.join(' ')+'\\n'+L.join('\\n')", seed: 383}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        int n, q; scanf("%d %d", &n, &q);
        const int LOG = 18; vector<array<int, LOG>> up(n + 1); vector<int> dep(n + 1, 0);
        up[1].fill(1);
        for (int i = 2; i <= n; i++) { int p; scanf("%d", &p); up[i][0] = p; dep[i] = dep[p] + 1; for (int k = 1; k < LOG; k++) up[i][k] = up[up[i][k - 1]][k - 1]; }
        long long total = 0;
        while (q--) {
            int a, b; scanf("%d %d", &a, &b); int x = a, y = b;
            if (dep[x] < dep[y]) swap(x, y);
            for (int k = LOG - 1; k >= 0; k--) if (dep[x] - (1 << k) >= dep[y]) x = up[x][k];
            if (x != y) { for (int k = LOG - 1; k >= 0; k--) if (up[x][k] != up[y][k]) { x = up[x][k]; y = up[y][k]; } x = up[x][0]; }
            total += dep[a] + dep[b] - 2 * dep[x];
        }
        printf("%lld\n", total);
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          int n, q; scanf("%d %d", &n, &q); vector<int> par(n + 1, 0), dep(n + 1, 0);
          for (int i = 2; i <= n; i++) { scanf("%d", &par[i]); dep[i] = dep[par[i]] + 1; }
          long long t = 0;
          while (q--) { int a, b; scanf("%d %d", &a, &b); int x = a, y = b; while (x != y) { if (dep[x] < dep[y]) swap(x, y); x = par[x]; } t += dep[a] + dep[b] - 2 * dep[x]; }
          printf("%lld\n", t);
      }
  editorial:
    hint: Naik satu per satu ke leluhur bisa butuh N langkah per pertanyaan bila pohonnya berbentuk rantai.
    idea: Binary lifting — simpan leluhur ke-2^k untuk setiap simpul, sehingga lompatan sejauh apa pun bisa dipecah jadi O(log N) lompatan.
    solution: Samakan kedalaman, lalu lompat bersama selama leluhurnya berbeda. Jarak = dep[a] + dep[b] − 2·dep[LCA].
    complexity: O((N + Q) log N)
