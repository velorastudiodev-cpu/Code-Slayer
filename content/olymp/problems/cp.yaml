# Modul "C++ untuk CP": STL, fast I/O, template.
- id: ol-c-fastio
  title: Sejuta Laporan Gagak
  stage: cp
  topics: [fast-io]
  tl: 1000
  statement: |
    Gagak membawa N laporan; laporan ke-i berisi bilangan A_i. Cetak (Σ A_i²) mod 1.000.000.007.
    Input-nya besar: pakai I/O cepat (ios::sync_with_stdio(false); cin.tie(nullptr); atau scanf).
  input: |
    Baris pertama N. Baris kedua A_1 … A_N.
  output: |
    (Σ A_i²) mod 10^9+7.
  constraints: |
    1 ≤ N ≤ 1.000.000, 0 ≤ A_i ≤ 10^9
  samples: ["3\n1 2 3\n"]
  subtasks:
    - points: 40
      desc: "N ≤ 1000"
      tests: [{gen: "const n=1000;return n+'\\n'+R.arr(n,0,1e9).join(' ')", seed: 501}]
    - points: 60
      desc: "N ≤ 10^6"
      tests: [{gen: "const n=1000000;return n+'\\n'+R.arr(n,0,1e9).join(' ')", seed: 502}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        ios::sync_with_stdio(false); cin.tie(nullptr); // matikan sinkron dengan stdio C: cin jadi jauh lebih cepat
        int n; cin >> n; const long long MOD = 1000000007; long long s = 0;
        for (int i = 0; i < n; i++) { long long a; cin >> a; a %= MOD; s = (s + a * a) % MOD; }
        cout << s << '\n';
    }
  editorial:
    hint: Hati-hati, A_i² bisa mencapai 10^18 dan jumlahnya meluap. Kapan modulo diambil?
    idea: Ambil modulo SETIAP penjumlahan; (a mod p)² < 1,1·10^18 masih muat di long long. Untuk input sejuta bilangan, cin tanpa sinkron (atau scanf) cukup cepat.
    solution: ios::sync_with_stdio(false) + cin.tie(nullptr), lalu akumulasi dengan modulo.
    complexity: O(N)

- id: ol-c-stl
  title: Peringkat Unik
  stage: cp
  topics: [stl, sorting]
  tl: 1000
  statement: |
    Ada N nilai ujian. Cetak dua bilangan: banyak nilai BERBEDA, dan nilai terbesar ke-K di antara nilai berbeda (−1 bila nilai berbeda kurang dari K).
  input: |
    Baris pertama N dan K. Baris kedua N nilai.
  output: |
    Dua bilangan dipisah spasi.
  constraints: |
    1 ≤ N ≤ 200.000, 1 ≤ K ≤ N, 0 ≤ nilai ≤ 10^9
  samples: ["6 2\n90 80 90 70 80 100\n"]
  subtasks:
    - points: 100
      desc: Tanpa batasan tambahan
      tests: [{gen: "const n=200000;return n+' '+R.int(1,1000)+'\\n'+R.arr(n,0,1e9).join(' ')", seed: 511}, {gen: "const n=200000;return n+' 50\\n'+R.arr(n,0,30).join(' ')", seed: 512}, "1 1\n5\n"]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        int n, k; scanf("%d %d", &n, &k); vector<int> a(n); for (auto &x : a) scanf("%d", &x);
        sort(a.begin(), a.end(), greater<int>());              // urut menurun
        a.erase(unique(a.begin(), a.end()), a.end());          // unique hanya membuang duplikat BERURUTAN → harus diurutkan dulu
        printf("%d %d\n", (int)a.size(), k <= (int)a.size() ? a[k - 1] : -1);
    }
  editorial:
    hint: Fungsi STL apa yang menghapus duplikat? Apa syaratnya?
    idea: sort + unique + erase adalah idiom standar untuk mendapatkan nilai berbeda yang terurut.
    solution: Urutkan menurun, buang duplikat, lalu indeks K−1.
    complexity: O(N log N)

- id: ol-c-map
  title: Jurus Paling Sering
  stage: cp
  topics: [stl, map]
  tl: 1000
  statement: |
    Catatan latihan berisi N nama jurus. Cetak nama jurus yang paling sering muncul dan berapa kali; jika seri, pilih yang terkecil menurut abjad.
  input: |
    Baris pertama N. N baris berikutnya masing-masing berisi satu nama jurus (huruf kecil, tanpa spasi).
  output: |
    Nama jurus dan jumlahnya.
  constraints: |
    1 ≤ N ≤ 200.000, panjang nama ≤ 10
  samples: ["5\nair\nair\napi\npetir\napi\n"]
  subtasks:
    - points: 100
      desc: Tanpa batasan tambahan
      tests: [{gen: "const n=200000;const L=[];for(let i=0;i<n;i++)L.push(R.str(R.int(1,3),'abc'));return n+'\\n'+L.join('\\n')", seed: 521}, {gen: "const n=200000;const L=[];for(let i=0;i<n;i++)L.push(R.str(10));return n+'\\n'+L.join('\\n')", seed: 522}, "1\nkabut\n"]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        ios::sync_with_stdio(false); cin.tie(nullptr);
        int n; cin >> n; map<string,int> hitung; // map terurut menurut abjad
        for (int i = 0; i < n; i++) { string s; cin >> s; hitung[s]++; }
        string best; int bn = 0;
        for (auto &[s, c] : hitung) if (c > bn) { best = s; bn = c; } // > (bukan ≥): yang pertama menang saat seri
        cout << best << ' ' << bn << '\n';
    }
  editorial:
    hint: std::map menyimpan kunci terurut. Bagaimana memanfaatkannya untuk aturan seri?
    idea: Iterasi map berjalan dari kunci terkecil; ganti jawaban hanya bila jumlahnya LEBIH besar, sehingga saat seri yang terkecil tetap.
    solution: Hitung dengan map<string,int>, lalu satu kali iterasi.
    complexity: O(N log N)

- id: ol-c-set
  title: Kamar Kosong Terdekat
  stage: cp
  topics: [stl, set]
  tl: 1000
  statement: |
    Rumah persinggahan Kisatsutai memiliki kamar bernomor. Ada Q operasi:
    "1 x": kamar x menjadi kosong (bila sudah kosong, abaikan).
    "2 x": cari kamar kosong bernomor terkecil yang ≥ x, lalu kamar itu terisi (tidak kosong lagi). Jawab −1 bila tidak ada.
    Cetak jumlah semua jawaban operasi tipe 2.
  input: |
    Baris pertama Q. Q baris berikutnya berisi operasi.
  output: |
    Jumlah jawaban tipe 2.
  constraints: |
    1 ≤ Q ≤ 200.000, 1 ≤ x ≤ 10^9
  samples: ["5\n1 5\n1 3\n2 4\n2 4\n2 1\n"]
  subtasks:
    - points: 30
      desc: "Q ≤ 3000"
      tests: [{gen: "const q=3000;const L=[];for(let i=0;i<q;i++)L.push(R.int(1,2)+' '+R.int(1,1e9));return q+'\\n'+L.join('\\n')", seed: 531}]
    - points: 70
      desc: "Q ≤ 200.000"
      tests: [{gen: "const q=200000;const L=[];for(let i=0;i<q;i++)L.push((i<q/2?1:2)+' '+R.int(1,1e9));return q+'\\n'+L.join('\\n')", seed: 532}, {gen: "const q=200000;const L=[];for(let i=0;i<q;i++)L.push(R.int(1,2)+' '+R.int(1,1e9));return q+'\\n'+L.join('\\n')", seed: 533}]
  solution: |
    #include <bits/stdc++.h>
    using namespace std;
    int main() {
        int q; scanf("%d", &q); set<long long> kosong; long long total = 0;
        while (q--) {
            int t; long long x; scanf("%d %lld", &t, &x);
            if (t == 1) { kosong.insert(x); continue; }
            auto it = kosong.lower_bound(x); // elemen terkecil ≥ x dalam O(log N)
            if (it == kosong.end()) total += -1; else { total += *it; kosong.erase(it); }
        }
        printf("%lld\n", total);
    }
  naive:
    score: 30
    code: |
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          int q; scanf("%d", &q); vector<long long> v; long long total = 0;
          while (q--) {
              int t; long long x; scanf("%d %lld", &t, &x);
              if (t == 1) { if (find(v.begin(), v.end(), x) == v.end()) v.push_back(x); continue; }
              int b = -1; for (int i = 0; i < (int)v.size(); i++) if (v[i] >= x && (b < 0 || v[i] < v[b])) b = i;
              if (b < 0) total += -1; else { total += v[b]; v.erase(v.begin() + b); }
          }
          printf("%lld\n", total);
      }
  editorial:
    hint: Kita butuh struktur yang bisa menyisip, menghapus, dan mencari "terkecil yang ≥ x" dengan cepat.
    idea: std::set (pohon seimbang) mendukung ketiganya dalam O(log N); lower_bound memberi elemen terkecil ≥ x.
    solution: Tipe 1 → insert; tipe 2 → lower_bound, lalu erase bila ada.
    complexity: O(Q log Q)
