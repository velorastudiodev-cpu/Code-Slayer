lesson:
- text: 'CSS Grid membagi area menjadi baris dan kolom. grid-template-columns: repeat(3, 1fr) membuat tiga kolom sama lebar (fr = bagian dari sisa ruang). Item bisa melebar dengan grid-column: span 2.'
  code: |
    <!doctype html>
    <html lang="id">
    <head>
      <meta charset="utf-8">
      <title>Korps</title>
      <style>
    .galeri {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
      </style>
    </head>
    <body>
      <div class="galeri">
        <div class="item">Tanjiro</div>
        <div class="item">Zenitsu</div>
        <div class="item">Inosuke</div>
        <div class="item">Kanao</div>
        <div class="item">Genya</div>
        <div class="item">Nezuko</div>
      </div>
    </body>
    </html>
