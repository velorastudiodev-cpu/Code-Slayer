- id: web-m2-span
  type: write
  title: Pahlawan Utama
  difficulty: 2
  prompt: Dalam grid tiga kolom (sudah disediakan), buat item pertama (.item:first-child) melebar dua kolom.
  starter: |
    <!doctype html>
    <html lang="id">
    <head>
      <meta charset="utf-8">
      <title>Korps</title>
      <style>
    .galeri { display: grid; grid-template-columns: repeat(3, 1fr); }
      </style>
    </head>
    <body>
      <div class="galeri">
        <div class="item">Tanjiro</div>
        <div class="item">Zenitsu</div>
        <div class="item">Inosuke</div>
        <div class="item">Kanao</div>
        <div class="item">Genya</div>
        <div class="item">Nezuko</div>
      </div>
    </body>
    </html>
  checks:
  - sel: .item:first-child
    css: grid-column
    value: span 2
  - sel: .galeri
    css: display
    value: grid
  hints: |
    Atur di item, bukan di galeri.
    grid-column: span n.
    span 2.
  solution: |
    <!doctype html>
    <html lang="id">
    <head>
      <meta charset="utf-8">
      <title>Korps</title>
      <style>
    .galeri { display: grid; grid-template-columns: repeat(3, 1fr); }
    .item:first-child { grid-column: span 2; }
      </style>
    </head>
    <body>
      <div class="galeri">
        <div class="item">Tanjiro</div>
        <div class="item">Zenitsu</div>
        <div class="item">Inosuke</div>
        <div class="item">Kanao</div>
        <div class="item">Genya</div>
        <div class="item">Nezuko</div>
      </div>
    </body>
    </html>
