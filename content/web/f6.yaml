    </html>
  checks:
  - sel: .kartu
    css: width
    value: 300px
  - sel: .kartu
    css: margin-left
    value: auto
  - sel: .kartu
    css: margin-right
    value: auto
  - sel: .kartu
    css: margin-top
    value: '0'
  hints: |
    Elemen block butuh lebar tetap untuk ditengahkan.
    margin kiri dan kanan auto.
    margin: 0 auto;
  solution: |
    <!doctype html>
    <html lang="id">
    <head>
      <meta charset="utf-8">
      <title>Korps</title>
      <style>
    .kartu {
      width: 300px;
      margin: 0 auto;
    }
      </style>
    </head>
    <body>
      <div class="kartu">
        <h2>Kamado Tanjiro</h2>
        <p>Pernapasan Air</p>
      </div>
    </body>
    </html>
- id: web-f6-boxsizing
  type: quiz
  title: Lebar yang Jujur
  difficulty: 2
  prompt: 'Sebuah kotak punya width: 200px, padding: 20px, border: 5px. Dengan box-sizing: border-box, berapa lebar total yang terlihat?'
  options:
  - 200px
  - 250px
  - 240px
  - 210px
  explain: Dengan border-box, width SUDAH termasuk padding dan border; area konten yang menyusut menjadi 150px. Tanpa border-box (content-box) lebarnya 200 + 2×20 + 2×5 = 250px.
  hints: |
    border-box = width mencakup semuanya.
    Konten yang mengecil.
    Lebar total tetap sesuai width.
- id: web-f6-padding
  type: answer
  title: Ruang Dalam
  difficulty: 1
  prompt: Properti CSS untuk ruang di antara isi dan border elemen adalah...
  accept:
  - padding
  explain: padding = ruang dalam; margin = ruang luar (di luar border).
  hints: |
    Bukan margin.
    Bantalan.
    padding
